const cards=[{"section":"Exam 1","front":"<div class=\"number\">1<\/div><div class=\"stem\">The following have usually begun to ossify at birth:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the patella.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the lower femoral epiphysis.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the navicular.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the capitulum.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the pisiform.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the patella.<\/div><div class=\"explanation\">Appears at about 5 years of age.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the lower femoral epiphysis.<\/div><div class=\"explanation\">Appears at about 37 weeks gestation.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the navicular.<\/div><div class=\"explanation\">Usually the last of the tarsal bones to ossify. The ossification centre for the navicular appears at about 4 years of age.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the capitulum.<\/div><div class=\"explanation\">Appears at about 1 year and is the first ossification centre to be seen at the elbow. It is usually (but not always) followed by the radial head, internal epicondyle, trochlea, olecranon and external epicondyle.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the pisiform.<\/div><div class=\"explanation\">Appears at about 11 years of age and is the last carpal bone to ossify.<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">2<\/div><div class=\"stem\">In the normal wrist:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the scaphoid and the lunate articulate with the distal radius.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the scaphoid and the lunate articulate with the head of the capitate.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the pisiform articulates with the posterior surface of the triquetrum.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the trapezium and trapezoid articulate with the scaphoid.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the proximal part of the triquetrum articulates with the ulna.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the scaphoid and the lunate articulate with the distal radius.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the scaphoid and the lunate articulate with the head of the capitate.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the pisiform articulates with the posterior surface of the triquetrum.<\/div><div class=\"explanation\">The pisiform articulates with the anterior surface of the triquetrum.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the trapezium and trapezoid articulate with the scaphoid.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the proximal part of the triquetrum articulates with the ulna.<\/div><div class=\"explanation\">The proximal part of the triquetrum articulates with the triangular articular disc of the wrist joint.<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">3<\/div><div class=\"stem\">In the wrist:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the triquetrum lies in the distal carpal row.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the radiocarpal joint communicates with the midcarpal joint.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the pisiform is the only carpal bone to give attachment to both the flexor and extensor retinaculae.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the scaphoid is the most anterior carpal bone on a true lateral radiograph.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the capitate is usually ossified at birth.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the triquetrum lies in the distal carpal row.<\/div><div class=\"explanation\">The proximal carpal row comprises the scaphoid, the lunate, the triquetrum and the pisiform. The distal row comprises the trapezium, the trapezoid, the capitate and the hamate.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the radiocarpal joint communicates with the midcarpal joint.<\/div><div class=\"explanation\">The radiocarpal joint does not communicate with the midcarpal joint in the normal wrist. The midcarpal joint communicates with the carpometacarpal joint.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the pisiform is the only carpal bone to give attachment to both the flexor and extensor retinaculae.<\/div><div class=\"explanation\">The flexor retinaculum attaches to the scaphoid tubercle and ridge of the trapezium laterally, and the pisiform and hook of the hamate medially. The extensor retinaculum attaches to the radius, pisiform and triquetral bones. The pisiform is the most anterior carpal bone.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the scaphoid is the most anterior carpal bone on a true lateral radiograph.<\/div><div class=\"explanation\">The pisiform, not the scaphoid, is the most anterior carpal bone.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the capitate is usually ossified at birth.<\/div><div class=\"explanation\">The capitate usually ossifies at about 4 months (not at birth).<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">5<\/div><div class=\"stem\">In the normal shoulder joint:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the long tendon of biceps is extracapsular.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the capsule is attached to the articular margin of the humeral head except at the inferior margin.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the subacromial bursa extends inwards under the acromion when the arm is abducted.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the \"rotator cuff\" comprises the fused tendons of subscapularis, supraspinatus, infraspinatus and teres major.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the articular surface of the humeral head is four times the area of the glenoid.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the long tendon of biceps is extracapsular.<\/div><div class=\"explanation\">It is intracapsular.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the capsule is attached to the articular margin of the humeral head except at the inferior margin.<\/div><div class=\"explanation\">Inferiorly, the capsule is attached to the neck of the humerus below the articular margin.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the subacromial bursa extends inwards under the acromion when the arm is abducted.<\/div><div class=\"explanation\">The subacromial bursa extends inwards under the acromion when the arm is abducted.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the \"rotator cuff\" comprises the fused tendons of subscapularis, supraspinatus, infraspinatus and teres major.<\/div><div class=\"explanation\">The \"rotator cuff\" comprises the fused tendons of subscapularis, supraspinatus, infraspinatus and teres minor (not teres major).<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the articular surface of the humeral head is four times the area of the glenoid.<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">7<\/div><div class=\"stem\">In the knee:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the fabella lies in the lateral head of the gastrocnemius muscle in about 80% of the population.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the superomedial aspect of the patella may ossify independently and remain discrete.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the posterior cruciate ligament is attached to the anterior intercondylar area of the tibia.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the lateral collateral ligament is attached to the lateral meniscus.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the lateral articular surface of the patella is larger than the medial articular surface.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the fabella lies in the lateral head of the gastrocnemius muscle in about 80% of the population.<\/div><div class=\"explanation\">The fabella, a sesamoid bone, lies in the lateral head of the gastrocnemius muscle in about 22% of the population.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the superomedial aspect of the patella may ossify independently and remain discrete.<\/div><div class=\"explanation\">The superolateral (not superomedial) aspect of the patella occasionally ossifies independently and remains discrete. This is referred to as a bipartite patella.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the posterior cruciate ligament is attached to the anterior intercondylar area of the tibia.<\/div><div class=\"explanation\">The posterior cruciate ligament is attached to the posterior intercondylar area and passes anteriorly, medially and superiorly to the lateral aspect of the medial femoral condyle.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the lateral collateral ligament is attached to the lateral meniscus.<\/div><div class=\"explanation\">The lateral collateral ligament is separate from the lateral meniscus. It is attached superiorly to the lateral epicondyle of the femur and inferiorly to the head of the fibula. However, the deep part of the medial collateral ligament is attached to the medial meniscus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the lateral articular surface of the patella is larger than the medial articular surface.<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">8<\/div><div class=\"stem\">Regarding the knee joint:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the suprapatellar bursa communicates with the knee joint.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the gastrocnemius bursa may communicate with the medial condylar cavity of the knee joint.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the medial meniscus of the knee joint is larger than the lateral meniscus.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the collateral ligaments of the knee joint are extracapsular.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the popliteus tendon is intracapsular.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the suprapatellar bursa communicates with the knee joint.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the gastrocnemius bursa may communicate with the medial condylar cavity of the knee joint.<\/div><div class=\"explanation\">In about 43% of individuals.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the medial meniscus of the knee joint is larger than the lateral meniscus.<\/div><div class=\"explanation\">The lateral meniscus is more rounded than the medial, which is more crescentic in shape.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the collateral ligaments of the knee joint are extracapsular.<\/div><div class=\"explanation\">The anterior and posterior cruciate ligaments of the knee joint are, by contrast, intracapsular but extrasynovial.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the popliteus tendon is intracapsular.<\/div><div class=\"explanation\">The popliteus tendon separates the lateral meniscus, to which it is attached, from the lateral collateral ligament of the knee joint.<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">11<\/div><div class=\"stem\">The femoral artery:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> is a continuation of the external iliac artery beyond the inguinal ligament.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> becomes the popliteal artery after piercing adductor magnus.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> lies anterior to the femoral vein in the adductor canal.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> supplies branches to the skin of the anterior abdominal wall.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> gives rise to the profunda femoris artery in the femoral triangle.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is a continuation of the external iliac artery beyond the inguinal ligament.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">becomes the popliteal artery after piercing adductor magnus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">lies anterior to the femoral vein in the adductor canal.<\/div><div class=\"explanation\">In the femoral sheath, the femoral artery lies lateral to the femoral vein. It changes position relative to the femoral vein as it passes from the femoral sheath downwards into the adductor canal.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">supplies branches to the skin of the anterior abdominal wall.<\/div><div class=\"explanation\">The femoral artery gives off superficial branches which supply the anterior abdominal wall and skin of the external genitalia.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">gives rise to the profunda femoris artery in the femoral triangle.<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">12<\/div><div class=\"stem\">Regarding the veins of the lower limb:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the long saphenous vein lies anterior to the medial malleolus.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the long saphenous vein contains less than five valves.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the short saphenous vein lies with the sural nerve anterior to the lateral malleolus.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> there is no communication between the short and long saphenous veins.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the long saphenous vein drains into the popliteal vein.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the long saphenous vein lies anterior to the medial malleolus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the long saphenous vein contains less than five valves.<\/div><div class=\"explanation\">The long saphenous vein contains at least 10 valves.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the short saphenous vein lies with the sural nerve anterior to the lateral malleolus.<\/div><div class=\"explanation\">The short saphenous vein lies with the sural nerve posterior to the lateral malleolus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">there is no communication between the short and long saphenous veins.<\/div><div class=\"explanation\">There are several channels of communication between the short and long saphenous veins.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the long saphenous vein drains into the popliteal vein.<\/div><div class=\"explanation\">The long saphenous vein drains into the femoral vein. The short saphenous vein drains into the popliteal vein.<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">13<\/div><div class=\"stem\">The clavicle:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> ossifies in membrane.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> has a secondary ossification centre at its lateral end which appears at 18 years and fuses at 25 years.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> forms a secondary cartilaginous joint with the sternum.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> has a rhomboid fossa in approximately 0.5% of the population.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> may exhibit a conoid tubercle for attachment of the costoclavicular ligament.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">ossifies in membrane.<\/div><div class=\"explanation\">It has no medullary cavity.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">has a secondary ossification centre at its lateral end which appears at 18 years and fuses at 25 years.<\/div><div class=\"explanation\">The secondary ossification centre is at the medial end of the clavicle (not the lateral end).<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">forms a secondary cartilaginous joint with the sternum.<\/div><div class=\"explanation\">The sternoclavicular joint is a synovial joint with an intra-articular fibrocartilaginous disc dividing the joint in two. The manubriosternal joint is a secondary cartilaginous joint.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">has a rhomboid fossa in approximately 0.5% of the population.<\/div><div class=\"explanation\">A rhomboid fossa occurs in 0.6% of normal clavicles; 33% of these are bilateral.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">may exhibit a conoid tubercle for attachment of the costoclavicular ligament.<\/div><div class=\"explanation\">The conoid tubercle is for attachment of the conoid part of the coracoclavicular ligament. The rhomboid fossa is the site of attachment for the costoclavicular ligament.<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">14<\/div><div class=\"stem\">Regarding the ribs:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the first costal cartilage to ossify is most commonly that of the first rib.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> all the ribs have two facets for the costovertebral joints.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the tubercle of a typical rib forms a synovial joint with the transverse process of its own vertebra.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> cervical ribs occur in approximately 1.5% of people.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> each rib forms a secondary cartilaginous joint with its costal cartilage.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the first costal cartilage to ossify is most commonly that of the first rib.<\/div><div class=\"explanation\">Ossification of the first costal cartilage often starts in the second or third decade. The costal cartilages of the lowest ribs ossify next, and the process progresses upwards.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">all the ribs have two facets for the costovertebral joints.<\/div><div class=\"explanation\">A typical rib has two facets: the lower facet forms a synovial joint with the upper costal facet of its own vertebra, and the upper facet with the lower costal facet of the vertebra above. However, the first rib has only one costovertebral facet and articulates with the T1 vertebra only.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the tubercle of a typical rib forms a synovial joint with the transverse process of its own vertebra.<\/div><div class=\"explanation\">The tubercle of a typical rib has two facets. The medial facet forms a synovial joint with the transverse process of its own vertebra. The lateral facet is non-articular and gives attachment to the lateral costotransverse ligament.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">cervical ribs occur in approximately 1.5% of people.<\/div><div class=\"explanation\">They are usually bilateral but asymmetric in size.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">each rib forms a secondary cartilaginous joint with its costal cartilage.<\/div><div class=\"explanation\">Each rib forms a primary cartilaginous joint with its costal cartilage. A primary cartilaginous joint is where bone and hyaline cartilage meet; a secondary cartilaginous joint (symphysis) is a union between bones whose articular surfaces are covered with a thin lamina of hyaline cartilage.<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">15<\/div><div class=\"stem\">Regarding the major airways:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the trachea bifurcates at the level of T5.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the normal subcarinal angle is approximately 90°.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the right main bronchus is both more vertical and longer than the left.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the trachea is reinforced by 15–20 incomplete rings of hyaline cartilage.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> on a lateral chest radiograph, the right upper lobe bronchus is visualised end-on above the left main stem bronchus.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the trachea bifurcates at the level of T5.<\/div><div class=\"explanation\">It bifurcates at the lower level of T5.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the normal subcarinal angle is approximately 90°.<\/div><div class=\"explanation\">The normal subcarinal angle is 60° ± 10° (standard deviation).<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the right main bronchus is both more vertical and longer than the left.<\/div><div class=\"explanation\">The right main bronchus is more vertical than the left, but shorter. The right main bronchus measures 2.5 cm in length and the left measures 5 cm.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the trachea is reinforced by 15–20 incomplete rings of hyaline cartilage.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">on a lateral chest radiograph, the right upper lobe bronchus is visualised end-on above the left main stem bronchus.<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">16<\/div><div class=\"stem\">The trachea is an immediate relation of:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the left vagus nerve.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the oesophagus.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the isthmus of the thyroid gland.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the thoracic duct.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the left brachiocephalic vein.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left vagus nerve.<\/div><div class=\"explanation\">The right vagus nerve is in contact with the trachea. The left is held away from the trachea by the great vessels and aortic arch.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the oesophagus.<\/div><div class=\"explanation\">The oesophagus is a direct posterior relation of the trachea.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the isthmus of the thyroid gland.<\/div><div class=\"explanation\">The isthmus of the thyroid gland is an anterior relation of the trachea.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the thoracic duct.<\/div><div class=\"explanation\">The thoracic duct passes from right to left, posterior to the oesophagus, at the level of T5.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left brachiocephalic vein.<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">17<\/div><div class=\"stem\">Regarding the fissures of the lung:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> all the accessory fissures comprise two layers of visceral pleura.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the minor fissure runs horizontally on the right at the level of the fourth costal cartilage.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the azygos fissure occurs in about 5% of normal individuals.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> on the lateral chest radiograph the left oblique fissure is usually more vertical than the right.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the inferior accessory fissure separates the lateral basal segment of the right lower lobe from the rest of the lobe.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">all the accessory fissures comprise two layers of visceral pleura.<\/div><div class=\"explanation\">The azygos fissure has four layers of visceral pleura. All the others have two layers.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the minor fissure runs horizontally on the right at the level of the fourth costal cartilage.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the azygos fissure occurs in about 5% of normal individuals.<\/div><div class=\"explanation\">It occurs in about 1% of normal individuals. It is visualised on 0.1% of chest radiographs.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">on the lateral chest radiograph the left oblique fissure is usually more vertical than the right.<\/div><div class=\"explanation\">The left oblique fissure therefore meets the diaphragm more posteriorly than the right.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the inferior accessory fissure separates the lateral basal segment of the right lower lobe from the rest of the lobe.<\/div><div class=\"explanation\">The inferior accessory fissure separates the medial basal segment of the lower lobe from the rest of the lobe. It occurs in about 25% of individuals, making it the most common accessory fissure.<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">18<\/div><div class=\"stem\">At the pulmonary hilum:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the density seen on a plain chest radiograph is mainly due to lymph nodes and bronchi.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the transverse diameter of the basal pulmonary artery is approximately 15 mm in an adult female.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the left pulmonary artery passes anterior to the left main bronchus throughout its course.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the hilar point is where the basal pulmonary artery crosses the upper lobe vein.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the right hilum is higher than the left in about 5% of people.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the density seen on a plain chest radiograph is mainly due to lymph nodes and bronchi.<\/div><div class=\"explanation\">The density of the normal hilum is mainly due to blood vessels.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the transverse diameter of the basal pulmonary artery is approximately 15 mm in an adult female.<\/div><div class=\"explanation\">It measures approximately 16 mm in men.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left pulmonary artery passes anterior to the left main bronchus throughout its course.<\/div><div class=\"explanation\">The left pulmonary artery initially lies anterior to the bronchus, then arches over the left main bronchus to lie posterior to it. The right pulmonary artery lies anterior to the right main bronchus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the hilar point is where the basal pulmonary artery crosses the upper lobe vein.<\/div><div class=\"explanation\">The hilar angle is formed by the intersection of the basal pulmonary artery and the upper lobe vein, and is normally about 120°.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the right hilum is higher than the left in about 5% of people.<\/div><div class=\"explanation\">The right hilum is higher than the left in about 0.05% of people. The hila are at the same level in about 3% of cases. In the remaining 97% of cases the left hilum is higher than the right.<\/div><\/div>","due":41},{"section":"Exam 1","front":"<div class=\"number\">4<\/div><div class=\"stem\">In the normal shoulder:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the joint capsule is lax inferiorly.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the normal acromiohumeral distance is greater than 7 mm.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the glenohumeral joint normally communicates with the subacromial bursa.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the normal glenohumeral joint space has a maximum width of 6 mm.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the rotator cuff muscles all insert into the lesser tuberosity of the humerus.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the joint capsule is lax inferiorly.<\/div><div class=\"explanation\">The joint capsule passes round the circumference of the glenoid fossa, extending proximally to include the root of the coracoid process and distally onto the anatomical neck of the humerus. It is strong, but lax inferiorly, allowing a wide range of movement.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the normal acromiohumeral distance is greater than 7 mm.<\/div><div class=\"explanation\">A distance less than 5 mm suggests a rotator cuff tear.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the glenohumeral joint normally communicates with the subacromial bursa.<\/div><div class=\"explanation\">The subacromial bursa does not normally communicate with the glenohumeral joint. However, the subscapular bursa does communicate with the synovial membrane of the glenohumeral joint.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the normal glenohumeral joint space has a maximum width of 6 mm.<\/div><div class=\"explanation\">If greater than 6 mm it is suggestive of a posterior dislocation.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the rotator cuff muscles all insert into the lesser tuberosity of the humerus.<\/div><div class=\"explanation\">Supraspinatus, infraspinatus and teres minor insert into the greater tuberosity of the humerus. Subscapularis inserts into the lesser tuberosity.<\/div><\/div>","due":42},{"section":"Exam 1","front":"<div class=\"number\">6<\/div><div class=\"stem\">Regarding the arterial supply to the upper limb:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the deep palmar arch is formed from the continuation of the radial artery.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the axillary artery lies lateral to the axillary vein.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the axillary artery becomes the brachial artery at the lower border of teres minor.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the axillary artery is divided into three parts by the pectoralis minor muscle.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the axillary artery commences at the medial border of the first rib.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the deep palmar arch is formed from the continuation of the radial artery.<\/div><div class=\"explanation\">The deep palmar arch is formed from the terminal branch of the radial artery anastomosing with the deep branch of the ulnar artery. The superficial arch is formed from the continuation of the ulnar artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the axillary artery lies lateral to the axillary vein.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the axillary artery becomes the brachial artery at the lower border of teres minor.<\/div><div class=\"explanation\">The axillary artery becomes the brachial artery at the lower border of teres major (not teres minor).<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the axillary artery is divided into three parts by the pectoralis minor muscle.<\/div><div class=\"explanation\">The first part (above pectoralis minor) has one branch; the second part (behind pectoralis minor) has two branches; the third part (below pectoralis minor) has three branches.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the axillary artery commences at the medial border of the first rib.<\/div><div class=\"explanation\">The axillary artery commences at the lateral border of the first rib.<\/div><\/div><div class=\"note\"><b>Note:<\/b><br>Branches of the axillary artery: superior thoracic artery, acromiothoracic (thoraco-acromial) trunk, lateral thoracic artery, subscapular artery, anterior and posterior circumflex humeral arteries.<br>Branches of the brachial artery: profunda brachii (accompanies the radial nerve in the spiral/radial groove of the humerus), nutrient artery to the humerus, muscular branches, and anastomotic branches to the elbow joint.<\/div>","due":42},{"section":"Exam 1","front":"<div class=\"number\">9<\/div><div class=\"stem\">The patella:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> is a sesamoid bone.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> is bipartite in 2% of cases.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> commonly has an irregular anterior margin.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> has two paired facets on its posterior surface.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> forms an attachment for the capsule of the knee joint.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is a sesamoid bone.<\/div><div class=\"explanation\">A sesamoid is a fibrous, cartilaginous or bony nodule within a tendon. The only constant examples are the patella (the largest), and one in each of the two tendons of flexor pollicis brevis in the hand and flexor hallucis brevis in the foot.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is bipartite in 2% of cases.<\/div><div class=\"explanation\">A bipartite patella occurs much more commonly in males than females. When present, this normal variant occurs bilaterally in 43% of cases.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">commonly has an irregular anterior margin.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">has two paired facets on its posterior surface.<\/div><div class=\"explanation\">On the posterior surface of the patella there are three paired facets for articulation with the patellar surface of the femur. There is also a medial facet for articulation, in full flexion, with the medial margin of the intercondylar notch of the femur.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">forms an attachment for the capsule of the knee joint.<\/div><\/div>","due":42},{"section":"Exam 1","front":"<div class=\"number\">10<\/div><div class=\"stem\">In the normal hip:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the ischiofemoral ligament is the strongest of the three ligaments.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the joint capsule attaches to the intertrochanteric crest posteriorly.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the artery of the ligamentum teres originates from the obturator artery.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the angle of inclination of the femoral neck is normally about 127° in adults.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the ossification centre for the femoral head is visible at birth.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the ischiofemoral ligament is the strongest of the three ligaments.<\/div><div class=\"explanation\">The iliofemoral ligament (Y-shaped ligament of Bigelow) is the strongest ligament around the hip. The ischiofemoral ligament is the weakest. The pubofemoral ligament is the third ligament around the hip.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the joint capsule attaches to the intertrochanteric crest posteriorly.<\/div><div class=\"explanation\">Posteriorly, the joint capsule does not extend as far as the intertrochanteric crest — it is attached halfway along the femoral neck. Anteriorly the joint capsule is attached to the intertrochanteric line.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the artery of the ligamentum teres originates from the obturator artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the angle of inclination of the femoral neck is normally about 127° in adults.<\/div><div class=\"explanation\">In neonates, the angle of inclination is normally 160°. The angle of anteversion is 50° at birth and 8° in adults.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the ossification centre for the femoral head is visible at birth.<\/div><div class=\"explanation\">It appears during the first year of life.<\/div><\/div>","due":42},{"section":"Exam 1","front":"<div class=\"number\">19<\/div><div class=\"stem\">On a normal PA chest radiograph:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the left paraspinal line is wider than the right.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the maximum width of the right paratracheal line is 3 mm.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the azygos vein should not have a diameter greater than 5 mm.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the posterior junction line extends above the suprasternal notch and comprises four layers of pleura.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the aortic nipple is formed by the left superior intercostal vein arching around the aortic arch.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the left paraspinal line is wider than the right.<\/div><div class=\"explanation\">The maximum diameter of the right paraspinal line is 2 mm. The maximum width of the left paraspinal line is 1 cm.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the maximum width of the right paratracheal line is 3 mm.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the azygos vein should not have a diameter greater than 5 mm.<\/div><div class=\"explanation\">The azygos vein has a maximum diameter of 1 cm.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the posterior junction line extends above the suprasternal notch and comprises four layers of pleura.<\/div><div class=\"explanation\">Whereas the anterior junction line ends below the suprasternal notch.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the aortic nipple is formed by the left superior intercostal vein arching around the aortic arch.<\/div><\/div>","due":42},{"section":"Exam 1","front":"<div class=\"number\">20<\/div><div class=\"stem\">In the lung:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the left upper lobe is divided into three segments.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the bronchial arteries all arise directly from the aorta.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the lingula is divided into medial and lateral segments.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> an acinus comprises three to five terminal bronchioles.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the veins are usually anterior to the arteries.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left upper lobe is divided into three segments.<\/div><div class=\"explanation\">The left upper lobe comprises apicoposterior and anterior segments, and the lingula comprises superior and inferior segments.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the bronchial arteries all arise directly from the aorta.<\/div><div class=\"explanation\">There are usually three bronchial arteries: two on the left arising directly from the aorta, and one on the right arising from the third right posterior intercostal artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the lingula is divided into medial and lateral segments.<\/div><div class=\"explanation\">The lingula is divided into superior and inferior segments. The right middle lobe is divided into medial and lateral segments.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">an acinus comprises three to five terminal bronchioles.<\/div><div class=\"explanation\">A secondary lobule comprises three to five terminal bronchioles. An acinus is all the lung parenchyma distal to one terminal bronchiole.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the veins are usually anterior to the arteries.<\/div><\/div>","due":42},{"section":"Exam 2","front":"<div class=\"number\">21<\/div><div class=\"stem\">Regarding the pulmonary vasculature:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the lower zone veins are more vertical than their corresponding arteries.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the normal mean pulmonary arterial pressure is approximately 15 mmHg.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the truncus anterior arises from the right pulmonary artery at the hilum.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the pulmonary trunk is a posterior relation of the left atrium.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> in the upper lobes the veins usually lie lateral to the arteries.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the lower zone veins are more vertical than their corresponding arteries.<\/div><div class=\"explanation\">Lower zone veins tend to be more horizontal than the arteries. In the upper zones, the veins are more vertical than the arteries.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the normal mean pulmonary arterial pressure is approximately 15 mmHg.<\/div><div class=\"explanation\">Mean pulmonary venous pressure is approximately 3 mmHg.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the truncus anterior arises from the right pulmonary artery at the hilum.<\/div><div class=\"explanation\">The truncus anterior arises proximal to the hilum and passes to supply the right upper lobe.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the pulmonary trunk is a posterior relation of the left atrium.<\/div><div class=\"explanation\">The pulmonary trunk is anterior to the left atrium.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">in the upper lobes the veins usually lie lateral to the arteries.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">22<\/div><div class=\"stem\">At the level of the lower border of T4:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the left phrenic nerve lies adjacent to the trachea.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the thoracic duct lies anterior to the oesophagus.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the azygos vein joins the superior vena cava.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the second costal cartilage meets the manubrio-sternal joint.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the ligamentum arteriosum is situated here.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left phrenic nerve lies adjacent to the trachea.<\/div><div class=\"explanation\">It is separated from the trachea by the arch of the aorta.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the thoracic duct lies anterior to the oesophagus.<\/div><div class=\"explanation\">The thoracic duct crosses from right to left as it ascends posterior to the oesophagus at the level of T4/T5.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the azygos vein joins the superior vena cava.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the second costal cartilage meets the manubrio-sternal joint.<\/div><div class=\"explanation\">The manubrio-sternal angle lies at the level of T4.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the ligamentum arteriosum is situated here.<\/div><div class=\"explanation\">This is the remnant of the ductus arteriosus, which connects the left pulmonary artery to the aorta in fetal life. It lies in the aortopulmonary window.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">23<\/div><div class=\"stem\">The superior vena cava:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> is formed at the level of T7.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> has two valves.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> has only one tributary.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> is an immediate relation of the right phrenic nerve.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> may be left sided.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">is formed at the level of T7.<\/div><div class=\"explanation\">It commences behind the manubrium (T3/4) and enters the right atrium.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">has two valves.<\/div><div class=\"explanation\">It has no valves.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">has only one tributary.<\/div><div class=\"explanation\">The azygos vein drains into it posteriorly at T4.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is an immediate relation of the right phrenic nerve.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">may be left sided.<\/div><div class=\"explanation\">In 0.3% of people.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">24<\/div><div class=\"stem\">Regarding the azygos venous system:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> embryologically the azygos vein develops from the right posterior cardinal vein.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the azygos vein is formed from the union of the ascending lumbar and right subcostal veins.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> it commences at the level of L5.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the hemiazygos vein crosses from left to right at the level of T9 to join the azygos vein.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the accessory hemiazygos vein receives bronchial veins from the left lung.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">embryologically the azygos vein develops from the right posterior cardinal vein.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the azygos vein is formed from the union of the ascending lumbar and right subcostal veins.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">it commences at the level of L5.<\/div><div class=\"explanation\">It commences in front of and slightly to the right of L2, and ascends to the right of the vertebral column.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the hemiazygos vein crosses from left to right at the level of T9 to join the azygos vein.<\/div><div class=\"explanation\">It passes posterior to the oesophagus, and receives the lower eight posterior intercostal veins.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the accessory hemiazygos vein receives bronchial veins from the left lung.<\/div><div class=\"explanation\">It also receives some veins from the middle third of the oesophagus.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">25<\/div><div class=\"stem\">The thoracic duct:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> commences as a continuation of the cisterna chyli at the level of L4.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> passes through the central tendon of the diaphragm at the level of T12.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> has no valves.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> drains the lymph from the whole thorax.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> crosses the posterior mediastinum from right to left and is then anterior to the oesophagus at the level of T5.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">commences as a continuation of the cisterna chyli at the level of L4.<\/div><div class=\"explanation\">It commences at L1.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">passes through the central tendon of the diaphragm at the level of T12.<\/div><div class=\"explanation\">It passes between the overlapping right and left crural fibres, behind the median arcuate ligament, at the level of T12.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">has no valves.<\/div><div class=\"explanation\">There are many valves, the last of which is approximately 5 cm proximal to the venous junction.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">drains the lymph from the whole thorax.<\/div><div class=\"explanation\">It drains the whole body below the diaphragm and the left half above it. The right side of the thorax, head and neck drain into the right lymphatic duct.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">crosses the posterior mediastinum from right to left and is then anterior to the oesophagus at the level of T5.<\/div><div class=\"explanation\">It crosses the posterior mediastinum from right to left, remaining posterior (not anterior) to the oesophagus.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">26<\/div><div class=\"stem\">Regarding lymphatic drainage:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the right lymphatic duct drains into the right brachiocephalic vein.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the thoracic duct has a diameter of 10–12 mm.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the thoracic duct is approximately 45 cm long.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the thoracic duct drains into the azygos vein.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the thoracic duct lies between the azygos vein and the descending aorta in the lower mediastinum.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the right lymphatic duct drains into the right brachiocephalic vein.<\/div><div class=\"explanation\">It drains the right side of the thorax, right arm, head and neck.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the thoracic duct has a diameter of 10–12 mm.<\/div><div class=\"explanation\">The diameter of the thoracic duct is 1–7 mm.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the thoracic duct is approximately 45 cm long.<\/div><div class=\"explanation\">The cisterna chyli is 6 cm long.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the thoracic duct drains into the azygos vein.<\/div><div class=\"explanation\">The thoracic duct enters the point of confluence of the left internal jugular and subclavian veins at the level of C7.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the thoracic duct lies between the azygos vein and the descending aorta in the lower mediastinum.<\/div><div class=\"explanation\">The azygos vein lies to the right of the thoracic duct and the descending aorta to its left.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">27<\/div><div class=\"stem\">The thymus:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> is usually situated in the anterior mediastinum.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> is predominantly composed of fatty tissue in young children.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> reaches its maximum weight at 2 years.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> consists of two lobes, the right is usually larger than the left.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> receives its blood supply from the inferior thyroid and internal thoracic arteries.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is usually situated in the anterior mediastinum.<\/div><div class=\"explanation\">It lies anterior to the great vessels and trachea.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">is predominantly composed of fatty tissue in young children.<\/div><div class=\"explanation\">It comprises lymphoid and epithelial cells in childhood, which are replaced by fatty tissue in adult life.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">reaches its maximum weight at 2 years.<\/div><div class=\"explanation\">It weighs 10–15 g at birth, grows for 2 years and then stops growing until 7 years, when it has a second growth spurt, reaching a maximum weight of 30–40 g at 11 years.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">consists of two lobes, the right is usually larger than the left.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">receives its blood supply from the inferior thyroid and internal thoracic arteries.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">28<\/div><div class=\"stem\">The following are situated in the aortopulmonary window:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the ductus node.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the left recurrent laryngeal nerve.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the left bronchial artery.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the left vagus nerve.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the ligamentum arteriosum.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the ductus node.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the left recurrent laryngeal nerve.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the left bronchial artery.<\/div><div class=\"explanation\">All these are situated in the aortopulmonary window, along with fat.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the left vagus nerve.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the ligamentum arteriosum.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">29<\/div><div class=\"stem\">The oesophagus:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> commences at the cricopharyngeus muscle at C4.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> pierces the diaphragm with the right phrenic nerve.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> has striated muscle in the wall of its upper third, and smooth muscle in the wall more distally.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> is retroperitoneal in its intra-abdominal portion.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> receives part of its blood supply from the thyrocervical trunk.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">commences at the cricopharyngeus muscle at C4.<\/div><div class=\"explanation\">It commences at the cricopharyngeus muscle at C6.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">pierces the diaphragm with the right phrenic nerve.<\/div><div class=\"explanation\">It passes through the diaphragm at the level of T10, accompanied by branches of the left gastric artery and both vagus nerves (left anteriorly, right posteriorly).<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">has striated muscle in the wall of its upper third, and smooth muscle in the wall more distally.<\/div><div class=\"explanation\">This probably accounts for the fact that normal physiological events occur more quickly in the upper oesophagus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is retroperitoneal in its intra-abdominal portion.<\/div><div class=\"explanation\">The distal 3 cm is retroperitoneal.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">receives part of its blood supply from the thyrocervical trunk.<\/div><div class=\"explanation\">The upper oesophagus is supplied by the inferior thyroid artery from the thyrocervical trunk; the middle portion by oesophageal branches of the aorta; and the lower portion by branches of the left gastric artery.<\/div><\/div><div class=\"note\"><b>Note:<\/b><br>Memory Aids (from margin notes)<br>Oesophageal blood supply/drainage: Arterial — Thyrocervical trunk, Aorta, Gastric (\"TAG\"). Venous — Brachiocephalic, Azygos, Gastric (\"BAG\").<\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">30<\/div><div class=\"stem\">The following cause impressions on the oesophagus:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the lower fibres of the inferior constrictor muscle of the pharynx cause a posterior impression.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the post-cricoid venous plexus causes a posterior impression.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the aortic knuckle at the level of T6.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the left main bronchus as it passes posterior to the oesophagus.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> an aberrant right subclavian artery causes an anterior impression.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the lower fibres of the inferior constrictor muscle of the pharynx cause a posterior impression.<\/div><div class=\"explanation\">This is the cricopharyngeus muscle.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the post-cricoid venous plexus causes a posterior impression.<\/div><div class=\"explanation\">This venous plexus commonly causes anterior impressions at C6.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the aortic knuckle at the level of T6.<\/div><div class=\"explanation\">The aortic knuckle may cause a left-sided impression at T4.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left main bronchus as it passes posterior to the oesophagus.<\/div><div class=\"explanation\">The left main bronchus indents the oesophagus as it passes in front of it.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">an aberrant right subclavian artery causes an anterior impression.<\/div><div class=\"explanation\">An aberrant right subclavian artery causes a posterior impression.<\/div><\/div><div class=\"note\"><b>Note:<\/b><br>Impression mnemonics: Posterior impressions — \"CP MARS\". Anterior impressions — \"VAAB\".<\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">31<\/div><div class=\"stem\">In the larynx:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the corniculate cartilages commonly ossify.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> each pyriform fossa lies between the aryepiglottic membrane medially, and the lamina of the thyroid cartilage laterally.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the vestibule separates the true and false vocal cords.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the triticeal cartilage lies in the thyrohyoid membrane.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the valleculae are paired depressions at the base of the tongue situated between the tongue and the epiglottis.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the corniculate cartilages commonly ossify.<\/div><div class=\"explanation\">The corniculate and cuneiform cartilages, and the epiglottis, are fibrocartilage and do not ossify. The thyroid, cricoid and arytenoid cartilages are hyaline cartilage and commonly ossify.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">each pyriform fossa lies between the aryepiglottic membrane medially, and the lamina of the thyroid cartilage laterally.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the vestibule separates the true and false vocal cords.<\/div><div class=\"explanation\">The laryngeal ventricle separates the true and false cords.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the triticeal cartilage lies in the thyrohyoid membrane.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the valleculae are paired depressions at the base of the tongue situated between the tongue and the epiglottis.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">32<\/div><div class=\"stem\">In the region of the larynx:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the hyoid bone is situated at the level of C3.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the thyroid cartilage is situated at the level of C6.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the cricoarytenoid articulations are synovial.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the angle at which the thyroid laminae meet is greater in males than females.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> at birth, the body of the hyoid bone is usually ossified.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the hyoid bone is situated at the level of C3.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the thyroid cartilage is situated at the level of C6.<\/div><div class=\"explanation\">The thyroid cartilage is at C4; the cricoid cartilage is at C6.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the cricoarytenoid articulations are synovial.<\/div><div class=\"explanation\">The cricothyroid articulation is also synovial.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the angle at which the thyroid laminae meet is greater in males than females.<\/div><div class=\"explanation\">The laminae meet at an angle of approximately 90° in males and 120° in females — i.e. males have a greater laryngeal prominence.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">at birth, the body of the hyoid bone is usually ossified.<\/div><div class=\"explanation\">The body and greater horn of the hyoid ossify at birth. The lesser horn ossifies during adolescence.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">33<\/div><div class=\"stem\">Regarding the thyroid gland:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> it receives all of its blood supply from the external carotid artery.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the thyroidea ima artery is present in about 50% of cases.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the inferior thyroid veins drain into the internal jugular vein.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the carotid sheath is a posterolateral relation.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the recurrent laryngeal nerve is a posteromedial relation.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">it receives all of its blood supply from the external carotid artery.<\/div><div class=\"explanation\">The blood supply is from the external carotid artery (superior thyroid branch) and from the thyrocervical trunk (inferior thyroid artery).<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the thyroidea ima artery is present in about 50% of cases.<\/div><div class=\"explanation\">The thyroidea ima artery is present in about 3% of cases. It enters the lower border of the thyroid isthmus either from the brachiocephalic trunk, or directly from the aortic arch.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the inferior thyroid veins drain into the internal jugular vein.<\/div><div class=\"explanation\">The superior and middle thyroid veins drain into the internal jugular vein. The inferior thyroid vein drains into the innominate vein.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the carotid sheath is a posterolateral relation.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the recurrent laryngeal nerve is a posteromedial relation.<\/div><\/div>","due":41},{"section"
