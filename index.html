:"Exam 2","front":"<div class=\"number\">34<\/div><div class=\"stem\">With respect to the parathyroid glands:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> they are variable in number in the majority of individuals.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the superior glands are more constant in position than the inferior glands.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the inferior glands arise from the fourth pharyngeal pouch.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> they receive most of their blood supply from the inferior thyroid artery.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> normal parathyroid tissue may be located in the superior mediastinum.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">they are variable in number in the majority of individuals.<\/div><div class=\"explanation\">About 90% of individuals have four parathyroid glands; 2.5% have five glands.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the superior glands are more constant in position than the inferior glands.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the inferior glands arise from the fourth pharyngeal pouch.<\/div><div class=\"explanation\">The inferior parathyroid glands arise from the third pharyngeal pouch. The superior parathyroid glands arise from the fourth pharyngeal pouch.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">they receive most of their blood supply from the inferior thyroid artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">normal parathyroid tissue may be located in the superior mediastinum.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">35<\/div><div class=\"stem\">The female breast:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> lies on the deep fascia of the anterior chest wall between the second and sixth ribs.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> is supported by the ligaments of Cooper.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> has about 50 main ducts.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> has its exocrine tissue replaced by fat with increasing age.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> obtains its entire blood supply from the lateral thoracic artery.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">lies on the deep fascia of the anterior chest wall between the second and sixth ribs.<\/div><div class=\"explanation\">It lies on the superficial fascia (not the deep fascia) of the anterior chest wall between the second and sixth ribs.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is supported by the ligaments of Cooper.<\/div><div class=\"explanation\">These ligaments are fibrous tissue strands.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">has about 50 main ducts.<\/div><div class=\"explanation\">The breast has about 15 main ducts, each of which drains a lobe of the breast, and opens onto the nipple.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">has its exocrine tissue replaced by fat with increasing age.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">obtains its entire blood supply from the lateral thoracic artery.<\/div><div class=\"explanation\">The blood supply to the breast is derived mainly from the lateral thoracic artery, but it also receives branches from the internal mammary and intercostal arteries.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">36<\/div><div class=\"stem\">Regarding the pericardium:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> it comprises two layers between which is a potential space containing 20–25 ml serous fluid.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> it extends to surround the entire length of the superior vena cava.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> it is normally 1–2 mm thick.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the transverse sinus lies behind the ascending aorta.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the oesophagus is an immediate posterior relation.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">it comprises two layers between which is a potential space containing 20–25 ml serous fluid.<\/div><div class=\"explanation\">The two layers are the fibrous and the serous pericardium.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">it extends to surround the entire length of the superior vena cava.<\/div><div class=\"explanation\">Only the part of the superior vena cava below the azygos vein insertion is enveloped by pericardium.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">it is normally 1–2 mm thick.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the transverse sinus lies behind the ascending aorta.<\/div><div class=\"explanation\">The transverse sinus is a pericardial recess which may be mistaken for mediastinal adenopathy. The superior recess (oblique sinus) lies in front of the aorta.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the oesophagus is an immediate posterior relation.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">37<\/div><div class=\"stem\">In the heart:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the right atrium is the most posterior chamber.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the crista terminalis separates the right atrium from its appendage.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the left ventricle is characterised by a muscular conus (or infundibulum) and trabeculae carnae.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the left atrium receives two pulmonary veins.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the left ventricle is the most anterior chamber.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the right atrium is the most posterior chamber.<\/div><div class=\"explanation\">The left atrium is the most posterior chamber.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the crista terminalis separates the right atrium from its appendage.<\/div><div class=\"explanation\">The crista terminalis is a muscular ridge on the posterior wall of the right atrium, between the superior and inferior vena cava.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left ventricle is characterised by a muscular conus (or infundibulum) and trabeculae carnae.<\/div><div class=\"explanation\">These features characterise the right ventricle, aiding easy recognition at angiography.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left atrium receives two pulmonary veins.<\/div><div class=\"explanation\">The left atrium receives four pulmonary veins.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left ventricle is the most anterior chamber.<\/div><div class=\"explanation\">The right ventricle is the most anterior chamber.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">38<\/div><div class=\"stem\">Regarding the heart valves:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> in the normal individual, the mitral valve is the only bicuspid valve.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> on the frontal projection the aortic valve is the only valve that lies to the right of the midline.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> in the lateral projection the pulmonary valve is the most anterior of the valves.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> in the lateral projection the mitral valve is the most inferior of the valves.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the competence of the atrioventricular valves is reinforced by chordae tendinae.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">in the normal individual, the mitral valve is the only bicuspid valve.<\/div><div class=\"explanation\">The aortic, pulmonary and tricuspid valves each have three cusps.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">on the frontal projection the aortic valve is the only valve that lies to the right of the midline.<\/div><div class=\"explanation\">The tricuspid valve is the only valve lying to the right of the midline.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">in the lateral projection the pulmonary valve is the most anterior of the valves.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">in the lateral projection the mitral valve is the most inferior of the valves.<\/div><div class=\"explanation\">The tricuspid valve is the most inferior of the four valves.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the competence of the atrioventricular valves is reinforced by chordae tendinae.<\/div><div class=\"explanation\">The chordae are attached to the free borders of the cusps and to papillary muscles which arise from the ventricular walls.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">39<\/div><div class=\"stem\">Regarding the coronary arteries:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the right coronary artery arises from the right posterior aortic sinus.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the sinoatrial node is usually supplied by the right coronary artery.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> approximately 90% of individuals show right coronary artery dominance.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the circumflex artery has several diagonal branches.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the left anterior descending artery runs in the atrioventricular groove.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the right coronary artery arises from the right posterior aortic sinus.<\/div><div class=\"explanation\">The right coronary artery arises from the anterior aortic sinus. The left coronary artery arises from the left posterior aortic sinus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the sinoatrial node is usually supplied by the right coronary artery.<\/div><div class=\"explanation\">The sinoatrial node is supplied by the right coronary artery in about 60% of cases. The atrioventricular node is supplied by the right coronary artery in about 90% of cases.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">approximately 90% of individuals show right coronary artery dominance.<\/div><div class=\"explanation\">The dominant artery is defined as that giving off the posterior interventricular branch. Approximately 60% of the general population are right-dominant, 25% are co-dominant, and 15% are left-dominant.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the circumflex artery has several diagonal branches.<\/div><div class=\"explanation\">The diagonal branches arise from the left anterior descending artery. The circumflex artery has a left marginal branch.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left anterior descending artery runs in the atrioventricular groove.<\/div><div class=\"explanation\">The circumflex branch of the left coronary artery runs in the atrioventricular groove posteriorly. The left anterior descending artery runs in the interventricular groove.<\/div><\/div>","due":41},{"section":"Exam 2","front":"<div class=\"number\">40<\/div><div class=\"stem\">With respect to the venous drainage of the heart:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the coronary sinus receives about 90% of the venous drainage.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the coronary sinus lies in the posterior atrioventricular groove.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the coronary sinus drains directly into the right atrium.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the anterior cardiac veins drain into the coronary sinus.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the great cardiac vein accompanies the posterior interventricular artery.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the coronary sinus receives about 90% of the venous drainage.<\/div><div class=\"explanation\">The coronary sinus receives about 60% of the venous drainage.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the coronary sinus lies in the posterior atrioventricular groove.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the coronary sinus drains directly into the right atrium.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the anterior cardiac veins drain into the coronary sinus.<\/div><div class=\"explanation\">The anterior cardiac veins and venae cordis minimae open directly into the right atrium. The great cardiac, middle cardiac and small cardiac veins drain into the coronary sinus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the great cardiac vein accompanies the posterior interventricular artery.<\/div><div class=\"explanation\">The great cardiac vein accompanies the left anterior descending artery in the interventricular groove. The middle cardiac vein accompanies the posterior interventricular artery in the posterior interventricular groove.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">41<\/div><div class=\"stem\">Regarding the diaphragm:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the left crus is longer than the right.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the left hemidiaphragm is usually higher than the right.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the oesophageal hiatus passes through the central tendon.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the medial arcuate ligament is a thickening of the psoas fascia.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the aorta passes posterior to the median arcuate ligament accompanied by the thoracic duct and azygos vein.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left crus is longer than the right.<\/div><div class=\"explanation\">The right crus is longer. It attaches to L1–3, whereas the left attaches to L1 and L2 only.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left hemidiaphragm is usually higher than the right.<\/div><div class=\"explanation\">The right hemidiaphragm is 1.5–2.5 cm higher than the left in 90% of cases.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the oesophageal hiatus passes through the central tendon.<\/div><div class=\"explanation\">The oesophageal hiatus passes through the crura of the diaphragm at the level of T10. The hiatus for the inferior vena cava is through the central tendon (level T8).<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the medial arcuate ligament is a thickening of the psoas fascia.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the aorta passes posterior to the median arcuate ligament accompanied by the thoracic duct and azygos vein.<\/div><div class=\"explanation\">The aortic opening is at the T12 level.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">42<\/div><div class=\"stem\">Concerning the peritoneal spaces:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the right paracolic gutter communicates directly with the right subhepatic space.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the left paracolic gutter communicates directly with the left subphrenic space.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> Rutherford Morison's pouch is the most dependent part of the right paravertebral groove in a supine patient.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the lesser sac is related posteriorly to the right kidney.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the lesser sac is related anteriorly to the stomach.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the right paracolic gutter communicates directly with the right subhepatic space.<\/div><div class=\"explanation\">The right paracolic gutter also communicates with the right subphrenic space.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left paracolic gutter communicates directly with the left subphrenic space.<\/div><div class=\"explanation\">This communication is prevented by the phrenicocolic ligament extending from the splenic flexure of the colon to the left hemidiaphragm.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">Rutherford Morison's pouch is the most dependent part of the right paravertebral groove in a supine patient.<\/div><div class=\"explanation\">Rutherford Morison's pouch, the hepatorenal fossa, is the posterior extension of the right subhepatic space.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the lesser sac is related posteriorly to the right kidney.<\/div><div class=\"explanation\">The lesser sac is related posteriorly to the left kidney, left adrenal, pancreas and left hemidiaphragm.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the lesser sac is related anteriorly to the stomach.<\/div><div class=\"explanation\">The lesser sac is related anteriorly to the lesser omentum, stomach and greater omentum.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">43<\/div><div class=\"stem\">Regarding the normal duodenum:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the first part begins to the left of L1.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the first part is completely retroperitoneal.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the accessory pancreatic duct opens into the second part distal to the duodenal papilla.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> valvulae conniventes are absent in the fourth part.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the first part may be indented by the gall bladder.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the first part begins to the left of L1.<\/div><div class=\"explanation\">The duodenum begins at the pylorus, which lies about 2 cm to the right of L1. It ends at the duodenojejunal flexure, which lies to the left of L2.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the first part is completely retroperitoneal.<\/div><div class=\"explanation\">The first 2 cm of the first part of the duodenum has a short mesentery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the accessory pancreatic duct opens into the second part distal to the duodenal papilla.<\/div><div class=\"explanation\">The accessory pancreatic duct lies anterosuperior to the duodenal papilla.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">valvulae conniventes are absent in the fourth part.<\/div><div class=\"explanation\">Valvulae conniventes begin in the second part of the duodenum, becoming more prominent distally.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the first part may be indented by the gall bladder.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">44<\/div><div class=\"stem\">Regarding the duodenum:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the first part lies anterior to the gastroduodenal artery.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the first part lies posterior to the gall bladder and the quadrate lobe of the liver.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the second part lies anterior to the left kidney.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the third part lies anterior to the superior mesenteric vessels.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the paraduodenal fossa lies to the left of the fourth part of the duodenum.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the first part lies anterior to the gastroduodenal artery.<\/div><div class=\"explanation\">It also lies anterior to the common bile duct.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the first part lies posterior to the gall bladder and the quadrate lobe of the liver.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the second part lies anterior to the left kidney.<\/div><div class=\"explanation\">The second part of the duodenum lies anterior to the hilum of the right kidney and renal vessels. It lies posterior to the transverse mesocolon.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the third part lies anterior to the superior mesenteric vessels.<\/div><div class=\"explanation\">The third part is crossed anteriorly by the superior mesenteric vessels and the root of the small bowel mesentery. It passes to the left, anterior to the inferior vena cava and abdominal aorta, at the level of L3.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the paraduodenal fossa lies to the left of the fourth part of the duodenum.<\/div><div class=\"explanation\">The paraduodenal fossa is a recess of peritoneum beneath the most cephalad part of the inferior mesenteric vein.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">45<\/div><div class=\"stem\">The following statements are true:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the superior mesenteric artery is retroperitoneal.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the jejunum has a maximum diameter of approximately 4 cm.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the valvulae conniventes are about 1 mm thick in the middle and distal ileum.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> a Meckel's diverticulum is present in about 2% of people.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the stomach receives branches from the common hepatic artery.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the superior mesenteric artery is retroperitoneal.<\/div><div class=\"explanation\">It lies within the mesentery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the jejunum has a maximum diameter of approximately 4 cm.<\/div><div class=\"explanation\">The ileum has a smaller maximum diameter (approximately 3 cm).<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the valvulae conniventes are about 1 mm thick in the middle and distal ileum.<\/div><div class=\"explanation\">They are thicker in the jejunum, where they measure approximately 2 mm. They may be absent in the distended terminal ileum.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">a Meckel's diverticulum is present in about 2% of people.<\/div><div class=\"explanation\">This remnant of the vitellointestinal duct is usually located in the ileum within 1 m of the ileocaecal valve. It typically measures less than 5 cm in length.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the stomach receives branches from the common hepatic artery.<\/div><div class=\"explanation\">The stomach receives part of its blood supply from the right gastric and gastroduodenal arteries. Both are branches of the common hepatic artery.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">46<\/div><div class=\"stem\">In the large bowel:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the appendix is retrocaecal in the majority of cases.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> there is a sigmoid mesentery.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the ileocaecal valve lies anteromedially in the majority of cases.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the taeniae coli converge on the ileocaecal valve.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the haustra are more clearly defined in the ascending colon than in the descending colon.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the appendix is retrocaecal in the majority of cases.<\/div><div class=\"explanation\">It is retrocaecal in approximately 64% of cases.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">there is a sigmoid mesentery.<\/div><div class=\"explanation\">The mesentery starts at the rectosigmoid junction, usually at the level of S3.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the ileocaecal valve lies anteromedially in the majority of cases.<\/div><div class=\"explanation\">It lies posteromedially in approximately 90% of cases, in line with the first complete transverse haustral cleft of the proximal colon.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the taeniae coli converge on the ileocaecal valve.<\/div><div class=\"explanation\">The taeniae coli — one anterior, one posteromedial and one posterolateral — converge on the base of the appendix (not the ileocaecal valve).<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the haustra are more clearly defined in the ascending colon than in the descending colon.<\/div><div class=\"explanation\">The haustral sacculations arise between the three rows of taeniae, with clefts at the points of circular muscle fusion. In the proximal colon the haustra are fixed, whereas they result from active contraction of the taeniae from the mid-transverse colon onwards. When smooth muscle relaxants are given during a double-contrast barium enema, the left colon often shows no haustration.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">47<\/div><div class=\"stem\">The rectum:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> is filled by air during a double-contrast barium enema when the patient lies prone.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> is covered by the peritoneum anteriorly and laterally in its upper two-thirds.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> has lateral crescentic folds (plicae semilunares) which consist of mucosa and submucosa.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> has venous drainage to the portal system only.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> receives its main blood supply from the inferior mesenteric artery.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is filled by air during a double-contrast barium enema when the patient lies prone.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">is covered by the peritoneum anteriorly and laterally in its upper two-thirds.<\/div><div class=\"explanation\">Pelvic peritoneum covers the upper third of the rectum anteriorly and laterally, the middle third anteriorly only, and the lower third not at all.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">has lateral crescentic folds (plicae semilunares) which consist of mucosa and submucosa.<\/div><div class=\"explanation\">There are usually three lateral crescentic folds (valves of Houston), less than 5 mm thick, but they are variable in configuration.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">has venous drainage to the portal system only.<\/div><div class=\"explanation\">The superior rectal vein drains into the portal system, whilst the middle and inferior rectal veins drain into the systemic venous system. The rectum therefore forms a site of porto-caval anastomosis.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">receives its main blood supply from the inferior mesenteric artery.<\/div><div class=\"explanation\">It also receives blood from the middle rectal branches of the internal iliac arteries, the inferior rectal branches of the internal pudendal arteries, and the median sacral artery.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">48<\/div><div class=\"stem\">The abdominal aorta:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> bifurcates at the level of L5.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> gives rise to the coeliac axis at the level of T12.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> gives rise to four paired lumbar arteries.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> gives rise to the inferior phrenic arteries.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> is crossed anteriorly by the left renal vein at the level of L2.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">bifurcates at the level of L5.<\/div><div class=\"explanation\">It bifurcates at the level of the body of L4.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">gives rise to the coeliac axis at the level of T12.<\/div><div class=\"explanation\">It gives rise to the superior mesenteric and inferior mesenteric arteries at the L1 and L3 levels respectively.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">gives rise to four paired lumbar arteries.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">gives rise to the inferior phrenic arteries.<\/div><div class=\"explanation\">The aorta also gives rise to paired visceral branches: the adrenal, renal and gonadal arteries. The median sacral artery also arises from its posterior surface at the bifurcation.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is crossed anteriorly by the left renal vein at the level of L2.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">49<\/div><div class=\"stem\">The inferior vena cava:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> is longer than the aorta within the abdomen.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> drains the median sacral veins.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> drains the right adrenal and gonadal veins directly.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> is partly derived from the right supracardinal vein.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> is left sided in approximately 0.5% of cases.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is longer than the aorta within the abdomen.<\/div><div class=\"explanation\">The inferior vena cava starts at the level of L5, lower than the bifurcation of the aorta, and passes through the central tendon of the diaphragm at T8 (four vertebrae higher than the commencement of the abdominal aorta).<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">drains the median sacral veins.<\/div><div class=\"explanation\">The median sacral veins, companions to the artery, drain into the left common iliac vein in front of the body of L5.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">drains the right adrenal and gonadal veins directly.<\/div><div class=\"explanation\">Whereas the left adrenal and gonadal veins enter the left renal vein. The inferior vena cava also receives drainage directly from both renal veins, the third and fourth lumbar veins, the hepatic veins and the inferior phrenic veins.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is partly derived from the right supracardinal vein.<\/div><div class=\"explanation\">The inferior vena cava is derived from the persisting right supracardinal, right subcardinal and right vitelline veins.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is left sided in approximately 0.5% of cases.<\/div><div class=\"explanation\">The left inferior vena cava drains into the left renal vein, crosses the spine and continues cranially as a normal right-sided inferior vena cava.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">50<\/div><div class=\"stem\">The superior mesenteric artery:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> anastomoses with the inferior mesenteric artery at the hepatic flexure.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> supplies the left lobe of the liver in about 40% of cases.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> gives rise to the inferior pancreaticoduodenal artery.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> lies to the left of the superior mesenteric vein.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> passes anterior to the left renal vein.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">anastomoses with the inferior mesenteric artery at the hepatic flexure.<\/div><div class=\"explanation\">The left branch of the middle colic artery (of the superior mesenteric artery) anastomoses with a branch of the left colic artery (of the inferior mesenteric artery) in the region of the splenic flexure.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">supplies the left lobe of the liver in about 40% of cases.<\/div><div class=\"explanation\">The (replaced/accessory) left hepatic artery arises from the superior mesenteric artery in about 4% of cases.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">gives rise to the inferior pancreaticoduodenal artery.<\/div><div class=\"explanation\">The inferior pancreaticoduodenal artery is the first branch of the superior mesenteric artery. It anastomoses with the superior pancreaticoduodenal artery, a branch of the gastroduodenal artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">lies to the left of the superior mesenteric vein.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">passes anterior to the left renal vein.<\/div><div class=\"explanation\">The superior mesenteric artery passes anterior to the left renal vein and the third part of the duodenum to enter the mesentery of the small intestine.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">51<\/div><div class=\"stem\">The spleen:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> lies along the line of the eighth rib.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> lies on the phrenicocolic ligament.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> is directly related to the left kidney.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> receives its blood supply via the gastrosplenic ligament.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> may normally indent the greater curve of the stomach.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">lies along the line of the eighth rib.<\/div><div class=\"explanation\">Its long axis lies along the line of the tenth rib.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">lies on the phrenicocolic ligament.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is directly related to the left kidney.<\/div><div class=\"explanation\">The spleen abuts the upper pole of the left kidney. This produces a prominence on the lateral aspect of the kidney.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">receives its blood supply via the gastrosplenic ligament.<\/div><div class=\"explanation\">The splenic artery enters the spleen via the splenorenal ligament, which also contains the splenic vein and pancreatic tail.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">may normally indent the greater curve of the stomach.<\/div><div class=\"explanation\">The spleen is related anteriorly to the greater curve of the stomach and the splenic flexure of the colon, which both show splenic impressions.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">52<\/div><div class=\"stem\">The pancreas:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> decreases in size with advancing age.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> lies anterior to the confluence of the superior mesenteric and splenic veins.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> originates entirely from the dorsal gut diverticulum.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> is retroperitoneal.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> has a main duct which measures approximately 6 mm in diameter.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">decreases in size with advancing age.<\/div><div class=\"explanation\">Pancreatic tissue is gradually replaced by fat and fibrous tissue with advancing age.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">lies anterior to the confluence of the superior mesenteric and splenic veins.<\/div><div class=\"explanation\">The pancreatic neck lies anterior to this venous confluence.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">originates entirely from the dorsal gut diverticulum.<\/div><div class=\"explanation\">The uncinate process and part of the pancreatic head develop from the ventral gut diverticulum. The remainder of the pancreatic head, body and tail develop from the dorsal diverticulum.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is retroperitoneal.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">has a main duct which measures approximately 6 mm in diameter.<\/div><div class=\"explanation\">The calibre of the main pancreatic duct increases with age, but in subjects younger than 60 years, its maximum diameter in the region of the body should be no more than 2 mm.<\/div><\/div><div class=\"note\"><b>Note:<\/b><br>Normal Main Pancreatic Duct Diameter (by Region)<br>£ £ £<br>Head: 3 mm | Body: 2 mm | Tail: 1.5 mm<\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">53<\/div><div class=\"stem\">The head of the pancreas:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> is more cephalad than the tail.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> lies anterior to the common bile duct.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> is drained by the main pancreatic duct of Wirsung.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> receives its main blood supply from branches of the splenic artery.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> has an uncinate process which is crossed by the superior mesenteric vessels.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">is more cephalad than the tail.<\/div><div class=\"explanation\">The tail of the pancreas is higher than the head. It also lies anterior to the inferior vena cava in the region of the termination of the renal veins.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">lies anterior to the common bile duct.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is drained by the main pancreatic duct of Wirsung.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">receives its main blood supply from branches of the splenic artery.<\/div><div class=\"explanation\">It receives its main blood supply from pancreaticoduodenal arcades formed by branches of the gastroduodenal and superior mesenteric arteries. The neck, body and tail of the pancreas receive their main blood supply from branches of the splenic artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">has an uncinate process which is crossed by the superior mesenteric vessels.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">54<\/div><div class=\"stem\">The gall bladder:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> usually has a volume of approximately 300 ml.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> is related to the hepatic flexure of the colon.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> has a spiral valve composed of smooth muscle.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> normally has a wall thickness of about 1 cm.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> typically lies anteromedial to the right lobe of the liver.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">usually has a volume of approximately 300 ml.<\/div><div class=\"explanation\">The volume of the gall bladder is usually about 30–50 ml.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is related to the hepatic flexure of the colon.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">has a spiral valve composed of smooth muscle.<\/div><div class=\"explanation\">The spiral valve (of Heister) in the neck of the gall bladder is composed of crescentic folds of mucosa (not smooth muscle).<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">normally has a wall thickness of about 1 cm.<\/div><div class=\"explanation\">The normal gall bladder wall thickness is about 1 mm (not 1 cm).<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">typically lies anteromedial to the right lobe of the liver.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">55<\/div><div class=\"stem\">In the liver:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> a Riedel's lobe is more common in males than in females.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> venous drainage of the quadrate lobe is usually distinct from the rest of the liver.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the ligamentum teres is a remnant of the umbilical vein.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the caudate lobe lies between the inferior vena cava and the porta hepatis.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the bare area of the liver is applied directly to the diaphragm.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">a Riedel's lobe is more common in males than in females.<\/div><div class=\"explanation\">A Riedel's lobe, the downward projection of the anterolateral aspect of the right lobe of the liver, is more common in females.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">venous drainage of the quadrate lobe is usually distinct from the rest of the liver.<\/div><div class=\"explanation\">The venous drainage of the caudate lobe (not the quadrate lobe) is frequently distinct from the rest of the liver, draining direct to the inferior vena cava rather than into the hepatic veins.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the ligamentum teres is a remnant of the umbilical vein.<\/div><div class=\"explanation\">It runs in the free edge of the falciform ligament, which extends from the umbilicus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the caudate lobe lies between the inferior vena cava and the porta hepatis.<\/div><div class=\"explanation\">Whereas the quadrate lobe lies inferiorly and is bordered by the ligamentum teres and the gall bladder. Both the caudate lobe and the quadrate lobe are segments of the left lobe of the liver.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the bare area of the liver is applied directly to the diaphragm.<\/div><div class=\"explanation\">The bare area contains part of the inferior vena cava and hepatic veins.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">56<\/div><div class=\"stem\">In the hepatobiliary system:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the cystic artery arises from the right hepatic artery in the majority of cases.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the cystic duct usually lies to the left of the common hepatic duct.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the right hepatic artery crosses dorsal to the portal vein in about 10% of cases.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the right portal vein receives blood mainly from the superior mesenteric vein.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the hepatic veins follow the structures of the portal triad.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the cystic artery arises from the right hepatic artery in the majority of cases.<\/div><div class=\"explanation\">In about 90% of cases.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the cystic duct usually lies to the left of the common hepatic duct.<\/div><div class=\"explanation\">It usually lies on the right of the common hepatic duct.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the right hepatic artery crosses dorsal to the portal vein in about 10% of cases.<\/div><div class=\"explanation\">In the large majority of cases the right hepatic artery crosses ventral to the portal vein.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the right portal vein receives blood mainly from the superior mesenteric vein.<\/div><div class=\"explanation\">Whereas the left portal vein receives blood mainly from the splenic and inferior mesenteric veins.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the hepatic veins follow the structures of the portal triad.<\/div><div class=\"explanation\">The hepatic veins are intersegmental — they drain portions of adjacent segments of the liver and converge on the inferior vena cava. Each segment of the liver is supplied by a portal triad (hepatic artery, bile duct and portal vein).<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">57<\/div><div class=\"stem\">The portal vein:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> lies posterior to the common bile duct.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> is formed by the union of the splenic and inferior mesenteric veins.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> receives the left gastric vein.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> receives the right colic vein.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> provides about 75% of the blood supply to the liver.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">lies posterior to the common bile duct.<\/div><div class=\"explanation\">In the free edge of the lesser omentum the common bile duct lies to the right, the hepatic artery to the left, and the portal vein posteriorly. At the porta hepatis, the arrangement is: duct, artery and vein from anterior to posterior.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">is formed by the union of the splenic and inferior mesenteric veins.<\/div><div class=\"explanation\">The portal vein is formed behind the neck of the pancreas by the union of the splenic and superior mesenteric veins, with the inferior mesenteric vein joining at or near the angle of this union.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">receives the left gastric vein.<\/div><div class=\"explanation\">The portal vein usually also receives the right gastric vein, cystic vein and some duodenal or pancreatic veins.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">receives the right colic vein.<\/div><div class=\"explanation\">The right colic vein drains into the superior mesenteric vein, along with the right gastroepiploic, pancreaticoduodenal, jejunal, ileal and middle colic veins.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">provides about 75% of the blood supply to the liver.<\/div><div class=\"explanation\">25% of the blood supply to the liver is provided by the hepatic arteries (and thus 75% by the portal vein).<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">58<\/div><div class=\"stem\">Regarding the adrenal glands:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the medial limb of the right adrenal gland is smaller than the lateral limb.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the right adrenal gland lies cephalad to the right kidney.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the right crus of the diaphragm is a medial relation of the right adrenal gland.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> they receive branches from the inferior phrenic arteries.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the left adrenal vein drains directly into the inferior vena cava.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the medial limb of the right adrenal gland is smaller than the lateral limb.<\/div><div class=\"explanation\">The lateral limb of the right adrenal gland is the smaller.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the right adrenal gland lies cephalad to the right kidney.<\/div><div class=\"explanation\">The left adrenal gland lies anterior to the upper pole of the left kidney.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the right crus of the diaphragm is a medial relation of the right adrenal gland.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">they receive branches from the inferior phrenic arteries.<\/div><div class=\"explanation\">Superior adrenal branches arise from the inferior phrenic arteries bilaterally. The adrenal glands are also supplied by the middle adrenal arteries, which are direct branches from the aorta, and the inferior adrenal arteries, which are branches of the renal arteries.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left adrenal vein drains directly into the inferior vena cava.<\/div><div class=\"explanation\">The left adrenal vein drains into the left renal vein. The right adrenal vein drains directly into the inferior vena cava at the level of T12.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">59<\/div><div class=\"stem\">The right adrenal gland is directly related to the:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> quadrate lobe of the liver.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> aorta.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> body of the pancreas.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> second part of the duodenum.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> epiploic foramen.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">quadrate lobe of the liver.<\/div><div class=\"explanation\">The right adrenal gland is related to the bare area of the liver.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">aorta.<\/div><div class=\"explanation\">The right adrenal gland is related to the inferior vena cava.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">body of the pancreas.<\/div><div class=\"explanation\">The left (not right) adrenal gland is related to the body of the pancreas.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">second part of the duodenum.<\/div><div class=\"explanation\">The second part of the duodenum is separated from the right adrenal gland by the inferior vena cava.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">epiploic foramen.<\/div><div class=\"explanation\">The inferior vena cava lies between the epiploic foramen and the right adrenal gland.<\/div><\/div>","due":41},{"section":"Exam 3","front":"<div class=\"number\">60<\/div><div class=\"stem\">Regarding the kidneys:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the renal artery lies posterior to the ureter at the hilum.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> their superior poles lie closer to the median plane than their inferior poles.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> about 25% of kidneys receive their blood supply via multiple aortic branches.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> both are related to the colon anteriorly.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> typically each renal artery divides into four segmental branches.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the renal artery lies posterior to the ureter at the hilum.<\/div><div class=\"explanation\">At the renal hilum, the renal vein lies anteriorly, the ureter posteriorly and the renal artery in between.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">their superior poles lie closer to the median plane than their inferior poles.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">about 25% of kidneys receive their blood supply via multiple aortic branches.<\/div><div class=\"explanation\">There may be two, three or four renal arteries which enter through the renal sinus or at the superior or inferior pole of the kidney.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">both are related to the colon anteriorly.<\/div><div class=\"explanation\">Anteriorly the right and left kidneys are related to the hepatic and splenic flexures of the colon respectively.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">typically each renal artery divides into four segmental branches.<\/div><div class=\"explanation\">The renal artery typically divides into posterior and anterior branches, which together supply five segments: apical and posterior (from the posterior branch), and anterosuperior, anteroinferior and inferior (from the anterior branch).<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">62<\/div><div class=\"stem\">Each ureter:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> has three narrowings along its length.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> is lined by transitional cell epithelium.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> is retroperitoneal.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> lies lateral to the tips of the transverse processes of the lumbar vertebrae.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> receives part of its blood supply from the gonadal arteries.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">has three narrowings along its length.<\/div><div class=\"explanation\">These narrowings occur at the pelviureteric junction, pelvic brim and vesicoureteric junction.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is lined by transitional cell epithelium.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is retroperitoneal.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">lies lateral to the tips of the transverse processes of the lumbar vertebrae.<\/div><div class=\"explanation\">The ureters lie medial to the tips of the transverse processes of the lumbar vertebrae.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">receives part of its blood supply from the gonadal arteries.<\/div><div class=\"explanation\">The ureters receive their blood supply from branches of the renal, gonadal, common iliac and vesical arteries.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">63<\/div><div class=\"stem\">The right ureter lies:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> anterior to the iliac vessels.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> posterior to the gonadal vessels.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> posterior to the ileocolic artery.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> inferior to the vas deferens in the male pelvis.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> inferior to the broad ligament in the female pelvis.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">anterior to the iliac vessels.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">posterior to the gonadal vessels.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">posterior to the ileocolic artery.<\/div><div class=\"explanation\">The right ureter lies posterior to the ileocolic and right colic vessels, and the duodenum and the small bowel mesentery. The left ureter lies posterior to the left colic vessels and the sigmoid mesentery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">inferior to the vas deferens in the male pelvis.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">inferior to the broad ligament in the female pelvis.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">64<\/div><div class=\"stem\">Regarding the bony pelvis:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the inferior portion of the sacroiliac joint is synovial.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the subpubic angle in the adult female is greater than that in the male.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the symphysis pubis is a synovial joint.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the sacrum usually consists of four fused vertebrae with five paired anterior sacral foramina.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the adductor magnus muscle arises from the ischiopubic ramus and ischial tuberosity.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the inferior portion of the sacroiliac joint is synovial.<\/div><div class=\"explanation\">The superior portion of the sacroiliac joint is fibrous.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the subpubic angle in the adult female is greater than that in the male.<\/div><div class=\"explanation\">The subpubic angle is about 85° and 55° in the adult female and male pelves respectively.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the symphysis pubis is a synovial joint.<\/div><div class=\"explanation\">The symphysis pubis is a secondary cartilaginous joint.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the sacrum usually consists of four fused vertebrae with five paired anterior sacral foramina.<\/div><div class=\"explanation\">The sacrum usually consists of five fused vertebrae with four paired anterior sacral foramina.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the adductor magnus muscle arises from the ischiopubic ramus and ischial tuberosity.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">65<\/div><div class=\"stem\">The right ischiorectal fossa:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> has part of its lateral wall formed by the obturator externus muscle.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> contains the pudendal canal on its lateral wall.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> does not communicate with the left ischiorectal fossa.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> has part of its medial wall formed by the levator ani muscle.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> contains fat.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">has part of its lateral wall formed by the obturator externus muscle.<\/div><div class=\"explanation\">The lateral wall of the ischiorectal fossa is formed by the ischial tuberosity below and the obturator internus muscle above.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">contains the pudendal canal on its lateral wall.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">does not communicate with the left ischiorectal fossa.<\/div><div class=\"explanation\">The fossae communicate with each other through loose tissue behind the anal canal, providing a horseshoe-shaped path for the spread of infection.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">has part of its medial wall formed by the levator ani muscle.<\/div><div class=\"explanation\">The anal canal and levator ani muscles form the medial wall of each fossa.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">contains fat.<\/div><div class=\"explanation\">The ischiorectal fat pad allows for dilatation of the anal canal during defaecation and of the vagina during parturition.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">66<\/div><div class=\"stem\">In adults the normal size of:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the nulliparous uterus is approximately 4 cm x 2 cm.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the testis is approximately 4 cm x 2.5 cm.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the prostate is approximately 8 cm x 10 cm.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the ovary is approximately 0.2 cm x 0.3 cm x 0.4 cm.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the internal cervical os is up to 6 mm in diameter.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the nulliparous uterus is approximately 4 cm x 2 cm.<\/div><div class=\"explanation\">The non-pregnant uterus normally measures approximately 8 cm x 5 cm.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\ span><div class=\"ans-option\">the paired round ligaments are folds of peritoneum.<\/div><div class=\"explanation\">The round ligaments support the uterus and comprise fibromuscular bands extending from the labium majorum, through the deep inguinal ring, to attach to the uterus. The broad ligaments (not the round ligaments) are folds of peritoneum.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the arterial supply is from the internal iliac artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">it is covered by peritoneum on all but the inferior surface.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the isthmus is in continuity with the cervix.<\/div><div class=\"explanation\">The isthmus is the lowest half centimetre of the body of the uterus and this is continuous with the cervix.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">68<\/div><div class=\"stem\">Regarding the fallopian tubes:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> each tube is approximately 10 cm long.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> they communicate with the peritoneal cavity.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> they lie in the inferior border of the broad ligament.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the isthmus is the narrowest segment.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the folds of mucous membrane are arranged in the most complex manner in the region of the ampulla.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">each tube is approximately 10 cm long.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">they communicate with the peritoneal cavity.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">they lie in the inferior border of the broad ligament.<\/div><div class=\"explanation\">The uterine tubes lie in the superior border of the broad ligament.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the isthmus is the narrowest segment.<\/div><div class=\"explanation\">The other segments of the uterine tube are: the uterine part, ampulla and infundibulum.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the folds of mucous membrane are arranged in the most complex manner in the region of the ampulla.<\/div><div class=\"explanation\">The uterine tubes are lined with mucous membrane which is arranged in folds that are sparse in the isthmus and become increasingly complicated towards the ampulla.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">69<\/div><div class=\"stem\">Regarding the ovaries:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> prior to ovulation follicles measure approximately 18–24 mm.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> venous drainage of the right ovary is to the right renal vein.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> they lie anterolateral to the uterus.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> they commonly calcify in normal individuals.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> they lie anterior to the ureters.<\/div>","back":"<div class=\"answer-title\">Answers &amp
