; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">prior to ovulation follicles measure approximately 18–24 mm.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">venous drainage of the right ovary is to the right renal vein.<\/div><div class=\"explanation\">Venous drainage of the right ovary is to the inferior vena cava. Venous drainage of the left ovary is to the left renal vein.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">they lie anterolateral to the uterus.<\/div><div class=\"explanation\">They lie posterolateral to the uterus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">they commonly calcify in normal individuals.<\/div><div class=\"explanation\">Physiological calcification is rarely visible in the corpus albicans.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">they lie anterior to the ureters.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">70<\/div><div class=\"stem\">In antenatal ultrasound:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the fetal heart is first detectable at 4 weeks gestation.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the crown-rump length is the best measurement for assessing maturity at 6–12 weeks gestation.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the normal biparietal diameter at 18 weeks is approximately 40 mm.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the lateral ventricular ratio should not exceed 35%.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the gut is normally extra-abdominal at 16 weeks gestation.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the fetal heart is first detectable at 4 weeks gestation.<\/div><div class=\"explanation\">It is first detectable at 6–7 weeks gestation.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the crown-rump length is the best measurement for assessing maturity at 6–12 weeks gestation.<\/div><div class=\"explanation\">Biparietal diameter may be used to assess maturity at 12–30 weeks, femur length at 14–22 weeks, and fetal abdominal circumference at 30–40 weeks.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the normal biparietal diameter at 18 weeks is approximately 40 mm.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the lateral ventricular ratio should not exceed 35%.<\/div><div class=\"explanation\">The lateral ventricular ratio is calculated by dividing the distance from the midline to the lateral wall of the lateral ventricle by the distance from the midline to the inner table of the skull, in the coronal plane.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the gut is normally extra-abdominal at 16 weeks gestation.<\/div><div class=\"explanation\">A loop of gut extrudes into the umbilical cord as the \"physiological hernia\" at about the end of the sixth week of gestation, and returns to the abdominal cavity towards the end of the tenth week.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">71<\/div><div class=\"stem\">The testis:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> has the epididymis as an immediate posterolateral relation.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> is surrounded by a fibrous capsule called the tunica vaginalis.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> has its venous drainage to the internal iliac vein.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> contains the rete testis near its posterior border.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> usually lies within the scrotum by the seventh fetal month.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">has the epididymis as an immediate posterolateral relation.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">is surrounded by a fibrous capsule called the tunica vaginalis.<\/div><div class=\"explanation\">The tunica vaginalis is a serous sac covering the anterior and lateral surfaces of the testis. The tunica albuginea is the fibrous capsule.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">has its venous drainage to the internal iliac vein.<\/div><div class=\"explanation\">Venous drainage of the testes is via the testicular veins. The right testicular vein drains to the inferior vena cava and the left to the left renal vein.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">contains the rete testis near its posterior border.<\/div><div class=\"explanation\">Semen drains via seminiferous tubules into the rete testis, from where the vasa efferentia pass towards the epididymis.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">usually lies within the scrotum by the seventh fetal month.<\/div><div class=\"explanation\">By the seventh fetal month the testis lies at the deep inguinal ring. It should be in the scrotum by birth.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">72<\/div><div class=\"stem\">The vas deferens:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> is embryologically derived from the Wolffian duct.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> commences at the head of the epididymis.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> is extraperitoneal within the pelvis.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> at the ampulla, lies medial to the seminal vesicles.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> loops over the ureter as the ureter enters the bladder.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is embryologically derived from the Wolffian duct.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">commences at the head of the epididymis.<\/div><div class=\"explanation\">Each vas deferens commences at the tail of the epididymis in the scrotum.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is extraperitoneal within the pelvis.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">at the ampulla, lies medial to the seminal vesicles.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">loops over the ureter as the ureter enters the bladder.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">73<\/div><div class=\"stem\">Regarding the male urethra:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the membranous urethra is the widest part.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the verumontanum is on the anterior wall of the prostatic urethra.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the prostatic duct openings lie lateral to the verumontanum.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the navicular fossa lies within the bulb of the urethra.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the penile urethra lies within the corpus spongiosum of the penis.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the membranous urethra is the widest part.<\/div><div class=\"explanation\">The prostatic urethra is the widest part.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the verumontanum is on the anterior wall of the prostatic urethra.<\/div><div class=\"explanation\">The verumontanum is on the posterior wall of the prostatic urethra and has the utricle and ejaculatory duct orifices on its ventral wall.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the prostatic duct openings lie lateral to the verumontanum.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the navicular fossa lies within the bulb of the urethra.<\/div><div class=\"explanation\">The navicular fossa is a short dilated region just proximal to the external urethral meatus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the penile urethra lies within the corpus spongiosum of the penis.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">74<\/div><div class=\"stem\">Regarding the bladder:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> it has a capacity of approximately 1.5 l.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the trigone lies between the ureteric orifices and the urethra.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the seminal vesicles are posterior relations in the male.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the obturator internus muscle is an inferolateral relation.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the pubovesical ligaments support the bladder superiorly.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">it has a capacity of approximately 1.5 l.<\/div><div class=\"explanation\">Capacity is about 500 ml.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the trigone lies between the ureteric orifices and the urethra.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the seminal vesicles are posterior relations in the male.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the obturator internus muscle is an inferolateral relation.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the pubovesical ligaments support the bladder superiorly.<\/div><div class=\"explanation\">The pubovesical ligaments are condensations of pelvic fascia that support the bladder inferiorly, along with puboprostatic ligaments in the male.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">75<\/div><div class=\"stem\">The following have their lymphatic drainage predominantly to the external iliac lymph nodes:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> testes.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> bladder.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> prostate.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> uterus.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> rectum.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">testes.<\/div><div class=\"explanation\">The testes have their lymphatic drainage to the para-aortic lymph nodes.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">bladder.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">prostate.<\/div><div class=\"explanation\">The prostate has its lymphatic drainage to the internal iliac nodes and sacral nodes.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">uterus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">rectum.<\/div><div class=\"explanation\">The rectum has its lymphatic drainage to the pararectal, preaortic and internal iliac nodes.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">76<\/div><div class=\"stem\">Concerning the cranial foramina and canals:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the superior orbital fissure transmits the maxillary division of the fifth cranial nerve.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the foramen ovale transmits the mandibular division of the fifth cranial nerve.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the foramen spinosum transmits the middle meningeal artery.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the superior orbital fissure lies between the greater and lesser wings of the sphenoid.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the left jugular foramen is usually larger than the right.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the superior orbital fissure transmits the maxillary division of the fifth cranial nerve.<\/div><div class=\"explanation\">The foramen rotundum transmits the maxillary nerve. The superior orbital fissure transmits the third, fourth and sixth cranial nerves, and the first (ophthalmic) branch of the fifth cranial nerve, along with the superior ophthalmic vein.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the foramen ovale transmits the mandibular division of the fifth cranial nerve.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the foramen spinosum transmits the middle meningeal artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the superior orbital fissure lies between the greater and lesser wings of the sphenoid.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the left jugular foramen is usually larger than the right.<\/div><div class=\"explanation\">The right jugular foramen is often larger than the left.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">77<\/div><div class=\"stem\">Regarding the bones of the skull:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the pterygoid processes arise from the inferior surface of the body of the sphenoid bone.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the occipital bone forms the posterior half of the clivus.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the occipital condyles are situated at the posterior half of the foramen magnum.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the jugular foramen lies lateral to the hypoglossal canal.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the internal jugular vein is transmitted through the medial portion of the jugular foramen.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the pterygoid processes arise from the inferior surface of the body of the sphenoid bone.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the occipital bone forms the posterior half of the clivus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the occipital condyles are situated at the posterior half of the foramen magnum.<\/div><div class=\"explanation\">The occipital condyles lie at the anterior half of the foramen magnum, their posterior poles separated by the width of the foramen and their anterior poles lying closer together.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the jugular foramen lies lateral to the hypoglossal canal.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the internal jugular vein is transmitted through the medial portion of the jugular foramen.<\/div><div class=\"explanation\">The internal jugular vein is transmitted through the lateral portion of the jugular foramen. The ninth, tenth and eleventh cranial nerves pass through the medial portion of the jugular foramen.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">78<\/div><div class=\"stem\">Regarding grooves and sutures of the calvarium:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the \"parietal star\" is caused by venous sinuses impressing on the inner table of the skull.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> parietal foramina are usually situated close to the sagittal suture.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the bregma is the point where the sagittal suture meets the lambdoid suture.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the asterion is the point where the lambdoid suture meets the squamosal suture.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> sutural sclerosis becomes more apparent with increasing age.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the \"parietal star\" is caused by venous sinuses impressing on the inner table of the skull.<\/div><div class=\"explanation\">The \"parietal star\" is caused by venous plexuses lying between the inner and outer tables of the skull.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">parietal foramina are usually situated close to the sagittal suture.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the bregma is the point where the sagittal suture meets the lambdoid suture.<\/div><div class=\"explanation\">The lambda marks the junction of the sagittal and lambdoid sutures. The bregma marks the junction of the sagittal and coronal sutures.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the asterion is the point where the lambdoid suture meets the squamosal suture.<\/div><div class=\"explanation\">The pterion marks the point where the coronal suture meets the sphenoid bone laterally.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">sutural sclerosis becomes more apparent with increasing age.<\/div><div class=\"explanation\">Sutural sclerosis is a physiological bony bridging process across the suture.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">79<\/div><div class=\"stem\">Regarding the skull in infancy and childhood:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the metopic suture passes obliquely through the occipital bone.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the metopic suture usually fuses within the first 6 months of extrauterine life.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> closure of the posterior fontanelle occurs at 18 months of age.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> at birth there are no vascular markings and no convolutional impressions.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the spheno-occipital synchondrosis begins to close by the age of 5 years.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the metopic suture passes obliquely through the occipital bone.<\/div><div class=\"explanation\">The mendosal sutures pass obliquely upwards and inwards from the lower part of the occipital bone bilaterally.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the metopic suture usually fuses within the first 6 months of extrauterine life.<\/div><div class=\"explanation\">The metopic suture of the frontal bone is present at birth, disappears from the ninth month onwards and is usually fused by the end of the second year. Occasionally it persists into adult life.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">closure of the posterior fontanelle occurs at 18 months of age.<\/div><div class=\"explanation\">Closure of the posterior fontanelle usually occurs at 6–8 months. Closure of the anterior fontanelle usually occurs at 15–18 months.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">at birth there are no vascular markings and no convolutional impressions.<\/div><div class=\"explanation\">The vascular markings and convolutional impressions appear between the second and third years.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the spheno-occipital synchondrosis begins to close by the age of 5 years.<\/div><div class=\"explanation\">The spheno-occipital synchondrosis begins to close during puberty.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">80<\/div><div class=\"stem\">The following may be seen on a submentovertical (axial) projection of the skull:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the foramen spinosum.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the lateral wall of the maxillary antrum.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the odontoid process of the axis.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the dorsum sellae.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the carotid canal.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the foramen spinosum.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the lateral wall of the maxillary antrum.<\/div><div class=\"explanation\">The lateral wall of the maxillary antrum has an S-shaped configuration which is superimposed on the lateral wall of the orbit; the latter appearing as a straight line.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the odontoid process of the axis.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the dorsum sellae.<\/div><div class=\"explanation\">The dorsum sellae is seen on lateral and half-axial (Towne's) projections.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the carotid canal.<\/div><\/div>","due":41},{"section":"Exam 4","front":"<div class=\"number\">61<\/div><div class=\"stem\">The right kidney:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> is usually smaller than the left.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> usually lies lower than the left.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> usually moves further during respiration than the left.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> is related to the duodenum.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> is drained by the right renal vein which is longer than the left renal vein.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is usually smaller than the left.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">usually lies lower than the left.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">usually moves further during respiration than the left.<\/div><div class=\"explanation\">The left kidney moves further than the right.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is related to the duodenum.<\/div><div class=\"explanation\">The duodenum is related to the anterior surface of the right kidney.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">is drained by the right renal vein which is longer than the left renal vein.<\/div><div class=\"explanation\">The left renal vein is longer than the right, crossing the aorta anteriorly to open into the inferior vena cava superior to the right renal vein.<\/div><\/div>","due":43},{"section":"Exam 5","front":"<div class=\"number\">83<\/div><div class=\"stem\">Regarding the branches of the aortic arch:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the common carotid artery bifurcates at about the level of the second cervical vertebra.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> in the neck, the internal carotid artery lies medial to the external carotid artery throughout its length.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the left common carotid artery arises from the innominate artery in about 27% of cases.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> an aberrant right subclavian artery occurs in about 1% of the population.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the left common carotid and left subclavian arteries have a common origin in about 1% of cases.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the common carotid artery bifurcates at about the level of the second cervical vertebra.<\/div><div class=\"explanation\">The common carotid artery divides into the external and internal carotid arteries at about the level of the fourth cervical vertebra.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">in the neck, the internal carotid artery lies medial to the external carotid artery throughout its length.<\/div><div class=\"explanation\">The internal carotid artery lies posterior to the external carotid artery; initially lateral to it, and then medial to it.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the left common carotid artery arises from the innominate artery in about 27% of cases.<\/div><div class=\"explanation\">This is the most common normal variant affecting the arteries arising from the aortic arch.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">an aberrant right subclavian artery occurs in about 1% of the population.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the left common carotid and left subclavian arteries have a common origin in about 1% of cases.<\/div><\/div><div class=\"note\"><b>Note:<\/b><br>fi fi<br>Internal carotid artery position in the neck (mnemonic): Lateral Posterior Medial (\"LPM\") relative to the external carotid artery.<\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">84<\/div><div class=\"stem\">The following arteries arise directly from the internal carotid artery:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the meningohypophyseal artery.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the anterior communicating artery.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the callosomarginal artery.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the posterior communicating artery.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the ophthalmic artery.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the meningohypophyseal artery.<\/div><div class=\"explanation\">The meningohypophyseal artery arises posteriorly within the cavernous sinus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the anterior communicating artery.<\/div><div class=\"explanation\">The anterior communicating artery acts as an arterial bridge between the anterior cerebral arteries. The latter are direct branches of the internal carotid arteries.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the callosomarginal artery.<\/div><div class=\"explanation\">The callosomarginal artery is one of the three main branches of the anterior cerebral artery, distal to the anterior communicating artery. The other distal branches of the anterior cerebral artery are the frontopolar and pericallosal arteries.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the posterior communicating artery.<\/div><div class=\"explanation\">The posterior communicating artery arises posteriorly from the distal loop of the carotid siphon to link the internal carotid artery with the posterior cerebral artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the ophthalmic artery.<\/div><div class=\"explanation\">The ophthalmic artery is usually given off just after the carotid artery leaves the cavernous sinus, but its origin is variable.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">85<\/div><div class=\"stem\">Regarding the internal carotid artery:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> it usually has no main branches in the neck.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> on entering the cranial cavity, it becomes subarachnoid in position.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the carotid siphon is formed by the cavernous segment only.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> it gives rise to the anterior choroidal artery.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> it anastomoses with both the external carotid and vertebrobasilar arterial systems.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">it usually has no main branches in the neck.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">on entering the cranial cavity, it becomes subarachnoid in position.<\/div><div class=\"explanation\">It lies external to the dura mater within the cranial cavity and cavernous sinus, and only enters the subarachnoid space at the level of the anterior clinoid process.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the carotid siphon is formed by the cavernous segment only.<\/div><div class=\"explanation\">The carotid siphon is formed by the cavernous and supraclinoid segments of the internal carotid artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">it gives rise to the anterior choroidal artery.<\/div><div class=\"explanation\">The anterior choroidal artery arises posteriorly from the carotid siphon just distal to the posterior communicating artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">it anastomoses with both the external carotid and vertebrobasilar arterial systems.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">86<\/div><div class=\"stem\">The external carotid artery gives rise to:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the ascending pharyngeal artery.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the inferior thyroid artery.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the internal maxillary artery.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the occipital artery.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the posterior auricular artery.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the ascending pharyngeal artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the inferior thyroid artery.<\/div><div class=\"explanation\">The inferior thyroid artery arises from the thyrocervical trunk, which arises from the subclavian artery. The superior thyroid artery is usually the first branch of the external carotid artery, but may arise from the terminal part of the common carotid artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the internal maxillary artery.<\/div><div class=\"explanation\">The internal maxillary artery is one of the terminal branches of the external carotid artery, as is the superficial temporal artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the occipital artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the posterior auricular artery.<\/div><div class=\"explanation\">The external carotid artery also gives rise to the lingual and facial arteries.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">87<\/div><div class=\"stem\">The vertebral artery:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> usually has a wider calibre on the left than the right.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> usually enters the foramen transversarium of the seventh cervical vertebra.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> arises from the thyrocervical trunk in some individuals.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> is usually the first branch of the subclavian artery.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> usually gives off the posterior inferior cerebellar artery just before entering the foramen magnum.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">usually has a wider calibre on the left than the right.<\/div><div class=\"explanation\">The left vertebral artery is usually the larger, but the right is larger in about 20% of cases.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">usually enters the foramen transversarium of the seventh cervical vertebra.<\/div><div class=\"explanation\">The vertebral artery usually passes through the foramina transversaria of the upper six cervical vertebrae. It enters the foramen of the seventh cervical vertebra in about 1% of cases.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">arises from the thyrocervical trunk in some individuals.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">is usually the first branch of the subclavian artery.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">usually gives off the posterior inferior cerebellar artery just before entering the foramen magnum.<\/div><div class=\"explanation\">The vertebral artery gives off the posterior inferior cerebellar artery after entering the cranial cavity (not before).<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">88<\/div><div class=\"stem\">The cavernous sinus:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> drains the ophthalmic veins.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> drains into the superior and inferior petrosal sinuses.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> contains the mandibular division of the trigeminal nerve.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> lies lateral to the sphenoid sinus and pituitary fossa.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> lies in the subarachnoid space.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">drains the ophthalmic veins.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">drains into the superior and inferior petrosal sinuses.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">contains the mandibular division of the trigeminal nerve.<\/div><div class=\"explanation\">The third, fourth and ophthalmic and maxillary divisions of the fifth cranial nerve lie in the lateral wall of the cavernous sinus. The sixth cranial nerve runs through the cavernous sinus inferior and lateral to the internal carotid artery. The mandibular nerve passes downwards through the foramen ovale into the infratemporal fossa.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">lies lateral to the sphenoid sinus and pituitary fossa.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">lies in the subarachnoid space.<\/div><div class=\"explanation\">The cavernous sinus lies between the layers of the dura mater.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">89<\/div><div class=\"stem\">Regarding the cerebral veins:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the septal vein and the thalamostriate vein join to form the great cerebral vein of Galen.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the great cerebral vein of Galen joins the inferior sagittal sinus to form the sigmoid sinus.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the superior sagittal sinus usually drains to the right transverse sinus.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the great cerebral vein of Galen lies in the quadrigeminal cistern.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the cavernous sinus communicates with the veins of the face.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the septal vein and the thalamostriate vein join to form the great cerebral vein of Galen.<\/div><div class=\"explanation\">The septal vein and the thalamostriate vein join at the venous angle to form the internal cerebral vein. The internal cerebral veins and basal veins of Rosenthal join to form the great cerebral vein of Galen.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the great cerebral vein of Galen joins the inferior sagittal sinus to form the sigmoid sinus.<\/div><div class=\"explanation\">The great cerebral vein joins the inferior sagittal sinus to form the straight sinus (not the sigmoid sinus).<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the superior sagittal sinus usually drains to the right transverse sinus.<\/div><div class=\"explanation\">The superior sagittal sinus usually becomes the right transverse sinus, the right sigmoid sinus, then the right internal jugular vein. The straight sinus drains in a similar sequence on the left side.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the great cerebral vein of Galen lies in the quadrigeminal cistern.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the cavernous sinus communicates with the veins of the face.<\/div><div class=\"explanation\">Via the ophthalmic veins and pterygoid plexus.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">90<\/div><div class=\"stem\">Regarding the lateral ventricle:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the interventricular foramen connects the third ventricle with the fourth ventricle.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> they communicate with the central canal of the spinal cord.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the roof of the anterior horn of the lateral ventricle is formed by the corpus callosum.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the pineal body lies in the posterior wall of the third ventricle.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the median aperture (foramen of Magendie) connects the fourth ventricle with the cerebellomedullary cistern.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the interventricular foramen connects the third ventricle with the fourth ventricle.<\/div><div class=\"explanation\">The interventricular foramina of Munro connect each lateral ventricle to the third ventricle. A midline channel, the cerebral aqueduct of Sylvius, connects the third and fourth ventricles.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">they communicate with the central canal of the spinal cord.<\/div><div class=\"explanation\">Below the fourth ventricle the central canal extends through the spinal cord into the upper end of the filum terminale.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the roof of the anterior horn of the lateral ventricle is formed by the corpus callosum.<\/div><div class=\"explanation\">The floor of the anterior horn of the lateral ventricle is formed by the caudate nucleus and thalamus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the pineal body lies in the posterior wall of the third ventricle.<\/div><div class=\"explanation\">The habenular commissure, pineal body and posterior commissure form the posterior wall of the third ventricle. The lamina terminalis forms the anterior wall and the thalamus forms most of the lateral walls. The hypothalamus forms the lower lateral wall and most of the floor.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the median aperture (foramen of Magendie) connects the fourth ventricle with the cerebellomedullary cistern.<\/div><div class=\"explanation\">The paired lateral apertures (foramina of Luschka) also open into the pontine cistern. Through these three apertures — one median and two lateral — cerebrospinal fluid escapes from the ventricular system into the subarachnoid space for absorption by the arachnoid villi.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">91<\/div><div class=\"stem\">In the middle ear:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the spur is formed by the junction of the external auditory canal and the lateral wall of the attic.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the promontory forms the roof.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the handle of the malleus is attached to the tympanic membrane.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the incudomallear and incudostapedial joints are synovial.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the ossicles have the appearance of a \"molar tooth\" on a lateral tomogram.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the spur is formed by the junction of the external auditory canal and the lateral wall of the attic.<\/div><div class=\"explanation\">This is also referred to as the scutum. It forms the superior attachment of the tympanic membrane.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the promontory forms the roof.<\/div><div class=\"explanation\">The tegmen tympani forms the roof. The bony capsule of the basal turn of the cochlea is called the promontory.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the handle of the malleus is attached to the tympanic membrane.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the incudomallear and incudostapedial joints are synovial.<\/div><div class=\"explanation\">The incudomallear joint lies between the head of the malleus and the body of the incus. The incudostapedial joint lies between the long process of the incus and the head of the stapes.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the ossicles have the appearance of a \"molar tooth\" on a lateral tomogram.<\/div><div class=\"explanation\">The \"crown\" of the tooth is made up of the head of the malleus and the body of the incus. The \"roots\" of the tooth are the handle of the malleus and the long process of the incus. The malleus is anterior to the incus.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">92<\/div><div class=\"stem\">Regarding the ear:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the second part of the facial canal lies inferior to the lateral semicircular canal.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the carotid canal lies in the anterior wall of the middle ear.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the oval window lies superior to the round window.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the mastoid antrum lies posterior to the middle ear.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the pyramid lies superior to the aditus to the antrum.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the second part of the facial canal lies inferior to the lateral semicircular canal.<\/div><div class=\"explanation\">The facial canal is divided into three parts. The first part, or genu, curves anteriorly adjacent to the cochlea and contains the geniculate ganglion. The second part doubles back posteriorly to lie beneath the lateral semicircular canal. The third part descends vertically posterior to the external auditory canal to emerge at the stylomastoid foramen.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the carotid canal lies in the anterior wall of the middle ear.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the oval window lies superior to the round window.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the mastoid antrum lies posterior to the middle ear.<\/div><div class=\"explanation\">The opening into the antrum, the aditus to the antrum, lies in the superomedial part of the posterior wall of the middle ear.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the pyramid lies superior to the aditus to the antrum.<\/div><div class=\"explanation\">The pyramid is a bony projection from the posterior wall of the middle ear, lying below (not superior to) the aditus, and giving rise to the stapedius muscle.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">93<\/div><div class=\"stem\">Regarding the paranasal sinuses:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> they are rudimentary in the neonatal skull.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the frontal sinus opens into the superior meatus of the nasal cavity.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the maxillary sinus opens into the middle meatus of the nasal cavity.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> they are lined by ciliated mucous columnar epithelium.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the sphenoid sinus is usually divided into two by a thin septum.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">they are rudimentary in the neonatal skull.<\/div><div class=\"explanation\">The sinuses develop during childhood; the maxillary and ethmoid developing earlier than the frontal and sphenoid sinuses.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the frontal sinus opens into the superior meatus of the nasal cavity.<\/div><div class=\"explanation\">The frontal sinus opens into the middle meatus by the frontonasal duct.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the maxillary sinus opens into the middle meatus of the nasal cavity.<\/div><div class=\"explanation\">In addition, the sphenoid sinus opens into the spheno-ethmoidal recess. The anterior and middle ethmoidal air cells open into the middle meatus and the posterior ethmoidal air cells into the superior meatus.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">they are lined by ciliated mucous columnar epithelium.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the sphenoid sinus is usually divided into two by a thin septum.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">94<\/div><div class=\"stem\">In the temporomandibular joint:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> an articular disc divides the joint cavity into anterior and posterior compartments.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the lateral pterygoid muscle is inserted partly into the articular disc.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the capsule is attached inferiorly to the coronoid process of the mandible.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the sphenomandibular ligament lies medially.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> stability is maximised by occlusion.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">an articular disc divides the joint cavity into anterior and posterior compartments.<\/div><div class=\"explanation\">The fibrocartilaginous articular disc divides the joint cavity into superior and inferior compartments, which allow sliding and rotational movements respectively.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the lateral pterygoid muscle is inserted partly into the articular disc.<\/div><div class=\"explanation\">The lateral pterygoid muscle passes through the capsule of the joint to be inserted into the disc.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the capsule is attached inferiorly to the coronoid process of the mandible.<\/div><div class=\"explanation\">The capsule is attached inferiorly to the neck of the condylar process of the mandible.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the sphenomandibular ligament lies medially.<\/div><div class=\"explanation\">The sphenomandibular ligament passes from the spine of the sphenoid to the lingula of the mandible.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">stability is maximised by occlusion.<\/div><div class=\"explanation\">The joint is less stable in the open position.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">95<\/div><div class=\"stem\">Regarding dentition:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the normal adult has 32 teeth.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> there are normally 20 deciduous teeth.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the periodontal membrane is seen as a radiodense line outlining the root of a tooth on a radiograph.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> enamel is the most radiopaque tissue in the body.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the permanent teeth start to erupt at about 6 years of age.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the normal adult has 32 teeth.<\/div><div class=\"explanation\">Each quadrant has two incisors, one canine, two premolars and three molars.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">there are normally 20 deciduous teeth.<\/div><div class=\"explanation\">Each quadrant has two incisors, one canine and two molars.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the periodontal membrane is seen as a radiodense line outlining the root of a tooth on a radiograph.<\/div><div class=\"explanation\">The periodontal membrane is seen as a radiolucent line outlining the root. The lamina dura lies outside this, and appears as a radiopaque line around the root continuous with that of the adjacent teeth.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">enamel is the most radiopaque tissue in the body.<\/div><div class=\"explanation\">It has a calcified inorganic content of 97%. Metallic fillings are more radiopaque than enamel.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the permanent teeth start to erupt at about 6 years of age.<\/div><div class=\"explanation\">The permanent teeth in each quadrant erupt from medial to lateral. The lower teeth erupt 6–12 months earlier than the upper. Eruption is complete by about 20 years of age.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">96<\/div><div class=\"stem\">Regarding the parotid gland:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the retromandibular vein passes through it.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the parotid duct opens onto the cheek opposite the second upper premolar tooth.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the parotid duct pierces the masseter muscle.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the mastoid process is a posterior relation.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> an accessory parotid gland usually lies superficially on the masseter muscle.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the retromandibular vein passes through it.<\/div><div class=\"explanation\">The retromandibular vein, the facial nerve and the external carotid artery all pass through the parotid gland.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the parotid duct opens onto the cheek opposite the second upper premolar tooth.<\/div><div class=\"explanation\">It opens onto the cheek opposite the second upper molar (not premolar) tooth.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the parotid duct pierces the masseter muscle.<\/div><div class=\"explanation\">The parotid duct passes forwards over the masseter muscle, turns medially at its anterior border and pierces the buccinator.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the mastoid process is a posterior relation.<\/div><div class=\"explanation\">The parotid gland is related anteriorly to the angle of the mandible and the muscles attached to it. The external auditory meatus and temporomandibular joint lie superiorly. The styloid process lies medially, superficial to the carotid sheath.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">an accessory parotid gland usually lies superficially on the masseter muscle.<\/div><div class=\"explanation\">Several ducts open from an accessory gland into the main parotid duct.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">97<\/div><div class=\"stem\">Regarding normal development of the vertebral column:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> fusion of the posterior aspects of the neural arches commences earliest in the cervical region.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> fusion of the neural arches with the centrum commences earliest in the lumbar region.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> five secondary ossification centres are present in each vertebra at puberty.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the dens may have more than one ossification centre.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the anterior margins of the thoracic vertebral bodies may appear irregular.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">fusion of the posterior aspects of the neural arches commences earliest in the cervical region.<\/div><div class=\"explanation\">Fusion of the neural arches posteriorly starts in the lumbar region at 1 to 2 years and proceeds cephalad to the cervical region up to 7 years of age. Fusion in the sacral region occurs last.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">fusion of the neural arches with the centrum commences earliest in the lumbar region.<\/div><div class=\"explanation\">Fusion of the neural arches with the centrum starts in the cervical region at 3 years and proceeds caudad to the lumbar region, which ossifies at 6 years of age. Fusion in the sacral region occurs last.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">five secondary ossification centres are present in each vertebra at puberty.<\/div><div class=\"explanation\">These centres fuse at about 25 years.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the dens may have more than one ossification centre.<\/div><div class=\"explanation\">The dens may have two or three ossification centres; fractures may be simulated.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the anterior margins of the thoracic vertebral bodies may appear irregular.<\/div><div class=\"explanation\">There may be irregularity at the anterior and posterior margins of the thoracic vertebral bodies, representing vascular remnants and the basivertebral veins. The term Hahn's fissure relates to the anterior irregularity.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">98<\/div><div class=\"stem\">Regarding normal measurements in and around the spine:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> in children the posterior laminar line of C2 may be up to 1 mm behind the posterior spinal line.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> in children the atlanto-axial distance may be up to 8 mm.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the sagittal diameter of the cervical spinal canal at the level of C4 should not be less than 16 mm.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the prevertebral soft tissues in the adult should be less than 4 mm in width at the level of the nasopharynx.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the interpedicular distance should increase from L1 to L5.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">in children the posterior laminar line of C2 may be up to 1 mm behind the posterior spinal line.<\/div><div class=\"explanation\">This physiological subluxation is caused by ligamentous laxity in children.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">in children the atlanto-axial distance may be up to 8 mm.<\/div><div class=\"explanation\">The atlanto-axial distance is less than 4–5 mm in children. It should measure no more than 3 mm in adults.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the sagittal diameter of the cervical spinal canal at the level of C4 should not be less than 16 mm.<\/div><div class=\"explanation\">The sagittal diameter of the cervical spinal canal at the level of C4 may range from approximately 12–22 mm.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the prevertebral soft tissues in the adult should be less than 4 mm in width at the level of the nasopharynx.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the interpedicular distance should increase from L1 to L5.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">99<\/div><div class=\"stem\">Regarding the normal ligaments in the cervical spine:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the ligamenta flava are attached to the intervertebral discs and vertebral bodies anteriorly.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the membrana tectoria is a continuation of the posterior longitudinal ligament.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the ligamentum nuchae may calcify.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the cruciform ligament lies immediately behind the dens of the axis.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the apical ligament passes from the apex of the dens to the anterior edge of the foramen magnum.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the ligamenta flava are attached to the intervertebral discs and vertebral bodies anteriorly.<\/div><div class=\"explanation\">The ligamenta flava extend between adjacent laminae. The anterior longitudinal ligament is attached to the intervertebral discs and vertebral bodies anteriorly.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the membrana tectoria is a continuation of the posterior longitudinal ligament.<\/div><div class=\"explanation\">The posterior longitudinal ligament extends posterior to the vertebral bodies from the occipital bone to the sacrum. The membrana tectoria refers to that part which extends from the occipital bone to C2.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the ligamentum nuchae may calcify.<\/div><div class=\"explanation\">The ligamentum nuchae is part of the supraspinous ligament, which joins the tips of the spinous processes and extends from the external occipital protuberance to the sacrum.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the cruciform ligament lies immediately behind the dens of the axis.<\/div><div class=\"explanation\">The transverse part of the cruciform ligament passes between the lateral masses of the atlas and behind the dens to form the posterior part of the median atlanto-axial joint.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the apical ligament passes from the apex of the dens to the anterior edge of the foramen magnum.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">100<\/div><div class=\"stem\">In the vertebral canal:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the spinal cord usually ends at the level of the L1/2 disc space in adults.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the spinal cord has its maximum diameter at the level of C7.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the cauda equina is situated within the subarachnoid space.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the spinal cord is supported by the denticulate ligaments.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the artery of Adamkiewicz is the major arterial supply to the dorsolumbar spinal cord.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the spinal cord usually ends at the level of the L1/2 disc space in adults.<\/div><div class=\"explanation\">95% of cords end within the limits of the vertebral bodies of L1 and L2, 3% at the level of T12 and 2% at L3. At birth, the spinal cord usually ends at the L3 level.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the spinal cord has its maximum diameter at the level of C7.<\/div><div class=\"explanation\">The spinal cord has its maximum diameter at the level of C5.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the cauda equina is situated within the subarachnoid space.<\/div><div class=\"explanation\">The cauda equina consists of lumbar and sacral nerve roots and the filum terminale. As the segmental nerves leave the vertebral canal, they are invested in the meningeal covering of the cord.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the spinal cord is supported by the denticulate ligaments.<\/div><div class=\"explanation\">The denticulate ligaments, layers of pia mater, lie laterally and are attached to the arachnoid and dura down to the level of the twelfth thoracic nerve.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the artery of Adamkiewicz is the major arterial supply to the dorsolumbar spinal cord.<\/div><div class=\"explanation\">It is an enlarged anterior radicular branch of a segmental artery in the T8–L4 region. It is left-sided in about 60% of cases.<\/div><\/div>","due":42},{"section":"Exam 5","front":"<div class=\"number\">81<\/div><div class=\"stem\">The following may be seen on a half-axial (Towne's) projection of the skull:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the foramen ovale.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the foramen rotundum.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the internal auditory meati.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the superior orbital fissure.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the condyle of the mandible.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the foramen ovale.<\/div><div class=\"explanation\">The foramen ovale is best seen on the submentovertical projection.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the foramen rotundum.<\/div><div class=\"explanation\">The foramen rotundum is best seen on the occipitofrontal projection.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the internal auditory meati.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the superior orbital fissure.<\/div><div class=\"explanation\">The superior orbital fissure is best seen on the occipitofrontal projection.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the condyle of the mandible.<\/div><\/div>","due":44},{"section":"Exam 5","front":"<div class=\"number\">82<\/div><div class=\"stem\">Physiological intracranial calcification occurs in:<\/div><div class=\"option\"><span class=\"letter\">A.<\/span> the pineal gland in approximately 5% of adults.<\/div><div class=\"option\"><span class=\"letter\">B.<\/span> the habenular commissure.<\/div><div class=\"option\"><span class=\"letter\">C.<\/span> the petroclinoid ligaments.<\/div><div class=\"option\"><span class=\"letter\">D.<\/span> the falx cerebri.<\/div><div class=\"option\"><span class=\"letter\">E.<\/span> the diaphragma sellae.<\/div>","back":"<div class=\"answer-title\">Answers &amp; Explanations<\/div><div class=\"ans-row\"><span class=\"ans-letter\">A.<\/span> <span class=\"verdict false\">False<\/span><div class=\"ans-option\">the pineal gland in approximately 5% of adults.<\/div><div class=\"explanation\">It occurs in about 60% of adults.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">B.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the habenular commissure.<\/div><div class=\"explanation\">In about 30% of adults.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">C.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the petroclinoid ligaments.<\/div><div class=\"explanation\">In about 12% of adults.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">D.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the falx cerebri.<\/div><div class=\"explanation\">In about 7% of adults.<\/div><\/div><div class=\"ans-row\"><span class=\"ans-letter\">E.<\/span> <span class=\"verdict true\">True<\/span><div class=\"ans-option\">the diaphragma sellae.<\/div><\/div>","due":44}];
const section=document.getElementById('section'),search=document.getElementById('search'),front=document.getElementById('front'),back=document.getElementById('back'),counter=document.getElementById('counter'),bar=document.getElementById('bar');let shown=[],i=0;
const sections=[...new Set(cards.map(x=>x.section))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));section.innerHTML='<option value="">كل المجموعات</option>'+sections.map(x=>`<option>${x}</option>`).join('');
function strip(s){const d=document.createElement('div');d.innerHTML=s;return d.textContent.toLowerCase()}
function filter(){const q=search.value.trim().toLowerCase();shown=cards.filter(c=>(!section.value||c.section===section.value)&&(!q||strip(c.front+' '+c.back).includes(q)));i=0;render()}
function render(){if(!shown.length){front.innerHTML='<div class="empty">لا توجد بطاقات مطابقة</div>';back.innerHTML='';counter.textContent='0 / 0';bar.style.width='0%';return}const c=shown[i];front.innerHTML=c.front;back.innerHTML=c.back;back.classList.remove('show');document.getElementById('reveal').textContent='إظهار الإجابة';counter.textContent=`${i+1} / ${shown.length} — ${c.section}`;bar.style.width=`${(i+1)/shown.length*100}%`}
section.onchange=filter;search.oninput=filter;document.getElementById('next').onclick=()=>{if(shown.length){i=(i+1)%shown.length;render()}};document.getElementById('prev').onclick=()=>{if(shown.length){i=(i-1+shown.length)%shown.length;render()}};document.getElementById('reveal').onclick=e=>{back.classList.toggle('show');e.target.textContent=back.classList.contains('show')?'إخفاء الإجابة':'إظهار الإجابة'};document.onkeydown=e=>{if(e.key==='ArrowLeft')document.getElementById('next').click();if(e.key==='ArrowRight')document.getElementById('prev').click();if(e.key===' ') {e.preventDefault();document.getElementById('reveal').click()}};filter();
</script></body></html>
